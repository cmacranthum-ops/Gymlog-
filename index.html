<title>ジム&amp;サウナ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ジム&amp;サウナ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, committed to a single dark look: black iron with violet light. Start = violet, Stop = hot pink, rest = deep violet glow. */
:root{
  color-scheme:dark;
  --bg:#08070b; --surface:#141119; --surface2:#1f1a28; --line:#2d2639; --ink:#f2eff8; --muted:#9b92ab;
  --violet:#8b5cf6; --violet-hi:#b69cff; --violet-deep:#2a1752; --violet-ink:#ffffff;
  --pink:#ec4f86; --pink-ink:#ffffff; --ok:#6fd6a0;
  --glow:0 0 0 1px rgba(139,92,246,.35),0 8px 30px rgba(139,92,246,.25);
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.02em;margin:4px 0 2px;text-wrap:balance;line-height:1.15}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}

/* entry screen */
.entry{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.entry svg.hero{position:absolute;inset:0;width:100%;height:100%}
.entry .content{position:relative;height:100%;justify-content:flex-end;padding:env(safe-area-inset-top,0px) max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;align-self:center;box-sizing:border-box}
.entry .brand{font-family:var(--display);font-size:64px;line-height:.9;letter-spacing:.02em;margin:0}
.entry .brandbox{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:150px}
.entry .brand{font-size:clamp(50px,16.5vw,96px);position:relative;z-index:1;white-space:nowrap;display:flex;align-items:flex-start;gap:.6em}

.entry .brand .bm{color:#c9b6ff;text-shadow:0 0 24px rgba(139,92,246,.8)}
.entry .brand .bs{color:#ff8fb4;text-shadow:0 0 24px rgba(214,51,108,.8)}
.entry .bsub .ta{color:#c9b6ff}
.entry .bsub .tm{color:#fff;margin:0 .35em}
.entry .bsub .tb{color:#ff8fb4}
.entry .bsub .tc{color:#fff;white-space:pre}
.entry .bsub{margin-top:0;font-size:16px;position:relative;z-index:1;text-shadow:0 1px 6px #000;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.25em;color:#cfc6e2}
.entry .bsub i{font-style:normal;opacity:.6}
.entry .lede{color:#cfc6e2;font-size:15px;margin:0}
.entry .who{font-size:13px;color:var(--muted)}
.entry .go{height:48px;font-size:16px!important;border-radius:16px;background:var(--violet);color:var(--violet-ink);font-size:18px;font-weight:800;letter-spacing:.06em;box-shadow:var(--glow)}
.entry .go:active{transform:scale(.985)}
.ob{display:flex;flex-direction:column;gap:6px}
.ob .seg button{padding:5px;font-size:13px}
.ob input{height:40px;border-radius:10px;background:rgba(20,17,25,.85);border:1px solid var(--line);padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);box-sizing:border-box;width:100%;min-width:0}
.ob input:focus{border-color:var(--violet)}
.ob .bwrow{position:relative}
.ob .bwrow span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--num);font-size:15px}
.ob .seg{background:rgba(20,17,25,.85);border:1px solid var(--line);align-self:flex-start}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .go{display:flex;align-items:center;justify-content:center;gap:8px}
.modes .go svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modes .go.sauna{background:linear-gradient(160deg,#e0457e,#8e1d52);box-shadow:0 8px 30px rgba(214,51,108,.35)}
.rounds{margin-top:12px}
.rounds .rh,.rounds .rr{display:grid;grid-template-columns:3.6em minmax(0,1fr) minmax(0,1fr) 24px;gap:6px;align-items:center}
.rounds .rh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.rounds .rr{padding:6px 0;border-top:1px solid var(--line)}
.rounds .rr:first-of-type{border-top:0}
.rounds .rr b{font-size:13px}
.sc2{display:flex;align-items:center;gap:2px;min-width:0}
.sc2 button{width:30px;height:38px;border-radius:9px;background:var(--surface2);font-size:18px;font-weight:600;flex:none}

// ---------- nearby saved gym ----------
function distM(a,b,c,d){ const R=6371000, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r; return Math.round(Math.sqrt(x*x+y*y)*R); }
// quick, coarse fix first (works indoors); fall back to GPS if that times out
const within = (p, ms, err) => Promise.race([p, new Promise((_,ng)=>setTimeout(()=>ng(err), ms))]);
function getPos(){
  const once = o => within(new Promise((ok,ng)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords), ng, o)), o.timeout+5000, {code:3});
  if(!navigator.geolocation) return Promise.reject({code:2});
  return once({enableHighAccuracy:false, timeout:10000, maximumAge:60000})
    .catch(e=> e && e.code===1 ? Promise.reject(e) : once({enableHighAccuracy:true, timeout:20000, maximumAge:60000}));
}
let lastPos=null;
// GPS → the nearest saved gym within 500 m is selected without asking (no map server involved)
async function autoGym(){
  const paint=h=>{ const b=sheet.querySelector("#nearList"); if(b) b.innerHTML=h; }, note=x=>`<p class="note" style="margin:0">${x}</p>`;
  paint(note(t("nearLocating")));
  try{
    const c=await getPos(); lastPos={lat:c.latitude, lon:c.longitude};
    const near=S.gyms.filter(g=>g.lat!=null && kindOf(g)===placeKind).map(g=>({g, d:distM(c.latitude,c.longitude,g.lat,g.lon)})).sort((x,y)=>x.d-y.d)[0];
    if(near && near.d<=500){ if(sheet.querySelector("#nearList")){ closeSheet(); pickPlace(near.g.id); } return; }
    paint("");
  }catch(e){
    paint(note((e&&e.code===1 ? t("nearDenied") : t("nearNoPos"))+` · <button class="link" style="padding:0" id="nearAgain">${t("nearRetry")}</button>`));
    const r=sheet.querySelector("#nearAgain"); if(r) r.onclick=autoGym;
  }
}
// Google Maps "Share → Copy" gives the place name (sometimes with address) followed by a maps.app.goo.gl link
function parseMapsShare(txt){
  const m = txt.match(/https?:\/\/\S+/); const url = m ? m[0] : "";
  const lines = txt.replace(url,"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let name = lines[0] || "";
  // a single-line field turns the newlines into spaces, so also cut where a Japanese address starts
  const cut = name.search(/\s(〒|東京都|北海道|(京都|大阪)府|\S{2,3}県)/); if(cut>0) name=name.slice(0,cut);
  name = name.replace(/^[「『"]|[」』"]$/g,"").replace(/\s*[-–]\s*Google\s*(マップ|Maps)$/i,"").trim();
  return {name, url};
}
function fmtHM(ms){ const m=Math.max(0,Math.round(ms/60000)); const h=Math.floor(m/60); return h? t("h",{h,m:m%60}) : t("m",{m}); }
function fmtLong(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600); return h? h+":"+pad(Math.floor(sec%3600/60))+":"+pad(sec%60) : fmt(sec); }
function clock(ts){ const d=new Date(ts); return d.getHours()+":"+pad(d.getMinutes()); }
function sessionSets(x){ return S.sets.filter(s=>s.sid===x.id).sort((a,b)=>a.t-b.t); }
function setsTxt(sets){ return isCardio(exById(sets[0]&&sets[0].ex)) ? sets.map(s=>fmt(s.d||0)).join(", ") : sets.map(s=>fmtKg(s.w)+"×"+s.r).join(", "); }
function groupByEx(list){
  const g=[], idx={};
  for(const s of list){ if(!(s.ex in idx)){ idx[s.ex]=g.length; g.push({ex:s.ex,sets:[]}); } g[idx[s.ex]].sets.push(s); }
  return g;
}

// usage frequency: number of distinct days an exercise was done; ties go to the more recent one
function usage(){
  const m = {};
  for(const s of S.sets){ const u = m[s.ex] || (m[s.ex]={days:new Set(),last:0,today:0});
    u.days.add(dayKey(s.t)); if(s.t>u.last) u.last=s.t; if(dayKey(s.t)===todayKey()) u.today++; }
  return m;
}
function sortedExercises(pred){
  const u = usage();
  return S.exercises.filter(e=>!e.hidden && pred(e))
    .map(e=>({e, n:u[e.id]?u[e.id].days.size:0, last:u[e.id]?u[e.id].last:0, today:u[e.id]?u[e.id].today:0}))
    .sort((a,b)=> b.n-a.n || b.last-a.last || a.e.o-b.e.o);
}

// body parts of one type, most trained first (distinct days), then the usual order
function partsFor(type){
  const days={}, today={};
  for(const s of S.sets){ const e=exById(s.ex); if(!e||e.type!==type) continue; (days[e.part] ||= new Set()).add(dayKey(s.t)); if(dayKey(s.t)===todayKey()) today[e.part]=(today[e.part]||0)+1; }
  const parts=[...new Set(S.exercises.filter(e=>!e.hidden&&e.type===type).map(e=>e.part))];
  return parts.map(p=>({p, n:days[p]?days[p].size:0, today:today[p]||0, count:S.exercises.filter(e=>!e.hidden&&e.type===type&&e.part===p).length}))
    .sort((a,b)=> b.n-a.n || PARTS.indexOf(a.p)-PARTS.indexOf(b.p));
}
// cardio machines and field sports are logged by time only
const isCardio = e => e && (e.type==="cardio" || e.type==="field" || e.type==="fit");

// ---------- estimated calories: METs × body weight (kg) × hours (Compendium of Physical Activities) ----------
const MET_STRENGTH = 3.5; // resistance training, general: gym time that isn't cardio
const MET_CARDIO = {treadmill:6.0, bike:7.0, elliptical:5.0, rowing:7.0, stairs:9.0,
  running:9.8, jogging:7.0, walking:3.5, sprint:10.0, soccer:7.0, futsal:7.0, basketball:6.5, tennis:7.3, baseball:5.0, volleyball:4.0,
  rugby:8.3, handball:8.0, badminton:5.5, tabletennis:4.0, golf:4.8, cycling:7.5, jumprope:11.8, hiking:6.0, swimming:5.8,
  feelcycle:8.5, bmonster:7.8, burness:7.3, lava:3.5, caldo:3.5, zenplace:3.0, pilatesk:3.0, curves:3.5, rizap:5.0, bodypump:5.0, bodycombat:7.3, zumba:6.5, crossfit:8.0, hiit:8.0, spinning:8.5, kickbox:7.3, aerobics:6.5, aquabics:5.3, yoga:2.5, pilates:3.0};
const LESSON_MIN = {feelcycle:45, bmonster:45, burness:45, lava:60, caldo:60, zenplace:50, pilatesk:50, curves:30, rizap:50, bodypump:45, bodycombat:45, zumba:45, crossfit:60, hiit:30, spinning:45, kickbox:45, aerobics:45, aquabics:45, yoga:60, pilates:50};
const MET_CARDIO_OTHER = 6.0;
const bodyKg = ()=> S.settings.bw || 65;
function ageNow(){ const b=S.settings.birth; if(!b) return null; const [y,m,d]=b.split("-").map(Number), n=new Date(); return n.getFullYear()-y-((n.getMonth()+1<m||(n.getMonth()+1===m&&n.getDate()<d))?1:0); }
// resting kcal per day (Mifflin-St Jeor); null until sex, height and birth date are all set
function bmr(){ const st=S.settings, a=ageNow(); if(!st.sex||!st.ht||a==null) return null; return 10*bodyKg()+6.25*st.ht-5*a+(st.sex==="m"?5:-161); }
const kcalOf = (met, sec)=>{ const b=bmr(); return b ? met*b/24*sec/3600 : met*bodyKg()*sec/3600; };
const setBw = w=>{ S.settings.bw=Math.round(w*10)/10; S.settings.bwU=Date.now(); };
function sessionKcal(x, until){
  const sets = sessionSets(x); let cardio=0, kc=0, strengthSets=0;
  for(const s of sets){ if(isCardio(exById(s.ex))){ cardio += s.d||0; kc += kcalOf(MET_CARDIO[s.ex]||MET_CARDIO_OTHER, s.d||0); } else strengthSets++; }
  const stay = ((until||x.end) - x.start)/1000;
  // sets logged without timing leave no stay time, so count at least 90 s per set
  return kc + kcalOf(MET_STRENGTH, Math.max(stay - cardio, strengthSets*90, 0));
}
function dayKcal(k){ return S.sessions.filter(x=>dayKey(x.start)===k).reduce((a,x)=>a+sessionKcal(x),0); }
const kcalTxt = k=> t("kcal",{k:Math.round(k).toLocaleString()});
const nav = {cat:null, part:null};

// ---------- audio / wake lock ----------
let actx=null;
function unlockAudio(){ try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(times){
  if(!actx) return;
  for(let i=0;i<times;i++){ const o=actx.createOscillator(), g=actx.createGain(); const tt=actx.currentTime+i*0.28;
    o.frequency.value=880; o.type="sine"; g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(0.35,tt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.2);
    o.connect(g).connect(actx.destination); o.start(tt); o.stop(tt+0.22); }
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
let wake=null;
async function keepAwake(){ try{ if("wakeLock" in navigator && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null;}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.timer.phase!=="idle") keepAwake(); });

// ---------- timer logic ----------
const T = ()=> S.timer;
function closeRest(now, exId){
  const tm=T(); if(tm.phase!=="rest" || (exId && tm.exId!==exId)) return;
  const s = S.sets.find(x=>x.id===tm.setId);
  if(s){ s.rest = Math.round((now - tm.start)/1000); touchSet(s); }
}
function startSet(exId){
  unlockAudio(); const now=Date.now(); closeRest(now, exId); sessionFor(now); closeSheet();
  S.timer = {phase:"work", exId, start:now}; keepAwake(); save({}); render();
}
// Stop: the set is logged with the weight chosen before Start, then the reps sheet opens while the rest timer runs
function stopSet(askReps){
  const tm=T(); if(tm.phase!=="work") return null; const now=Date.now();
  const s = logSet(tm.exId, Math.round((now-tm.start)/1000), tm.start);
  const x = sessionFor(now); x.end=now; x.u=now; s.sid=x.id;
  if(isCardio(exById(tm.exId))){ s.w=0; s.r=0; S.timer={phase:"idle"}; save({}); render(); toast(t("cardioDone",{name:exName(exById(s.ex)), t:fmt(s.d)})+" · "+kcalTxt(kcalOf(MET_CARDIO[s.ex]||MET_CARDIO_OTHER, s.d))); return s; }
  S.timer = {phase:"rest", exId:tm.exId, start:now, setId:s.id, beeped:false}; save({}); render();
  if(askReps!==false) askRepsFor(s.id);
  return s;
}
// fitness class logged by its length, ending now
function logLesson(exId, min){
  const now=Date.now(), st=now-min*60000; closeRest(now, exId);
  const s = logSet(exId, min*60, st); s.w=0; s.r=0;
  const x = sessionFor(now); if(x.start>st) x.start=st; x.end=now; x.u=now; s.sid=x.id;
  save({}); render(); toast(t("cardioDone",{name:exName(exById(exId)), t:fmt(s.d)})+" · "+kcalTxt(kcalOf(MET_CARDIO[exId]||MET_CARDIO_OTHER, s.d)));
}
function quickLog(exId){
  unlockAudio(); const now=Date.now(); closeRest(now, exId);
  const s = logSet(exId, null, now);
  const x = sessionFor(now); x.end=now; x.u=now; s.sid=x.id;
  S.timer = {phase:"rest", exId, start:now, setId:s.id, beeped:false}; keepAwake(); save({}); render();
  askRepsFor(s.id);
}

function finishExercise(){

  S.timer={phase:"idle"}; save({});

function endGym(){

const MAX_ROUNDS = 5;

const roundsOf = x=> x.rounds || Array.from({length:x.n||0}, ()=>({temp:x.temp, min:x.min}));
const saunaLine = x=> roundsOf(x).map((r,i)=>`${i+1}) ${r.temp}${isJa()?"℃":"°C"} ${r.min}${isJa()?"分":"min"}`).join(" · ");
// Sauna estimates. Calories: about 1.5 METs while sitting in the heat. Sweat: the weight lost when both weights are entered;
// otherwise roughly 15 g/min for a 70 kg person at 90 °C, scaled by temperature and body weight (a rough guide only).
const MET_SAUNA = 1.5;
const saunaMin = x=> roundsOf(x).reduce((a,r)=>a+(r.min||0),0);
const saunaKcal = x=> kcalOf(MET_SAUNA, saunaMin(x)*60);
const sweatMeasured = x=> x.wb && x.wa && x.wb>x.wa ? Math.round((x.wb-x.wa)*1000) : null;
const sweatG = x=> sweatMeasured(x) ?? Math.round(roundsOf(x).reduce((a,r)=>a+15*(r.min||0)*Math.min(1.4,Math.max(.3,((r.temp||90)-40)/50)),0)*bodyKg()/70);
const sweatTxt = x=> sweatMeasured(x)!=null ? t("sweat",{g:sweatG(x).toLocaleString()}) : t("sweatEst",{g:sweatG(x).toLocaleString()});
const saunaSum = x=> sweatTxt(x)+" · "+kcalTxt(saunaKcal(x));

// ---------- charts (inline SVG, no libraries) ----------
const hist = {mode:"list", metric:"ex", period:90, ex:null};
const DAY = 86400000;
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function bucketOf(ts, unit){ const d=new Date(startOfDay(ts)); if(unit==="week") d.setDate(d.getDate()-((d.getDay()+6)%7)); else if(unit==="month") d.setDate(1); return d.getTime(); }
function nextBucket(b, unit){ const d=new Date(b); if(unit==="day") d.setDate(d.getDate()+1); else if(unit==="week") d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1); return d.getTime(); }
function chartRange(){
  const to=Date.now(); let from;
  if(hist.period) from = startOfDay(to-(hist.period-1)*DAY);
  else { from = to; for(const s of S.sets) if(s.t<from) from=s.t; for(const x of S.sessions) if(x.start<from) from=x.start; for(const x of S.saunas) if(x.t<from) from=x.t; from=startOfDay(from); }
  const span=(to-from)/DAY;
  return {from, to, span, unit: span<=45?"day" : span<=200?"week" : "month"};
}
function bucketLabel(b, unit, long){
  const d=new Date(b);
  if(unit==="month") return isJa()? (long? d.getFullYear()+"年"+(d.getMonth()+1)+"月" : (d.getMonth()+1)+"月") : d.toLocaleDateString("en-US", long?{month:"short",year:"numeric"}:{month:"short"});
  if(long) return unit==="week"? t("weekOf",{d:(d.getMonth()+1)+"/"+d.getDate()}) : dayLabel(dayKey(b));
  return (d.getMonth()+1)+"/"+d.getDate();
}
// sum valFn(item) per bucket, empty buckets included
function perBucket(r, items, tsFn, valFn){
  const bs=[]; for(let b=bucketOf(r.from,r.unit); b<=r.to; b=nextBucket(b,r.unit)) bs.push(b);
  const idx=new Map(bs.map((b,i)=>[b,i])), v=bs.map(()=>0);
  for(const it of items){ const ts=tsFn(it); if(ts<r.from||ts>r.to) continue; const i=idx.get(bucketOf(ts,r.unit)); if(i!=null) v[i]+=valFn(it); }
  return bs.map((b,i)=>({b, v:v[i], label:bucketLabel(b,r.unit), long:bucketLabel(b,r.unit,true)}));
}
function niceStep(span, n){ const raw=span/n; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function fmtAxis(v){ return v>=10000? Math.round(v/100)/10+"k" : String(Math.round(v*10)/10); }
const CW=340, CH=190, CL=40, CR=8, CT=12, CB=24;
function gridY(lo, hi, st, y){ let g=""; for(let v=lo; v<=hi+st/1000; v+=st) g+=`<line x1="${CL}" x2="${CW-CR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${CL-6}" y="${(y(v)+3.5).toFixed(1)}" class="ya">${fmtAxis(v)}</text>`; return g; }
function barChart(pts, tipFn){
  const iw=CW-CL-CR, ih=CH-CT-CB;
  const mx=Math.max(0,...pts.map(p=>p.v)), st=niceStep(mx||1,4), top=Math.ceil((mx||1)/st)*st;
  const y=v=>CT+ih-(v/top)*ih, n=pts.length, bw=iw/n, every=Math.ceil(n/6);
  let bars="", xl="";
  pts.forEach((p,i)=>{ const x=CL+i*bw;
    bars+=`<g data-tip="${esc(tipFn(p))}"><rect x="${x.toFixed(1)}" y="${CT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent"/>${p.v>0?`<rect class="col hl" x="${(x+bw*.15).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${Math.max(1,ih*p.v/top).toFixed(1)}" rx="${Math.min(3,bw*.2).toFixed(1)}"/>`:""}</g>`;
    if(i%every===0) xl+=`<text x="${(x+bw/2).toFixed(1)}" y="${CH-6}" class="xa">${esc(p.label)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img">${gridY(0,top,st,y)}${bars}${xl}</svg>`;
}
// days: [{ts, a, b, tip}] two series drawn as lines (a = top weight, b = est. 1RM)
function lineChart(r, days){
  const iw=CW-CL-CR, ih=CH-CT-CB;
  const all=days.flatMap(d=>[d.a,d.b]); let mn=Math.min(...all), mx=Math.max(...all);
  const st=niceStep((mx-mn)||mx||1,4); const lo=Math.max(0,Math.floor(mn/st)*st - (mx===mn?st:0)), hi=Math.ceil(mx/st)*st + (mx===mn?st:0);
  const y=v=>CT+ih-((v-lo)/(hi-lo))*ih, x=ts=>CL+((ts-r.from)/Math.max(1,r.to-r.from))*iw;
  const path=k=>days.map((d,i)=>(i?"L":"M")+x(d.ts).toFixed(1)+" "+y(d[k]).toFixed(1)).join("");
  let xl=""; for(let i=0;i<4;i++){ const ts=r.from+(r.to-r.from)*(i+.5)/4; const d=new Date(ts); xl+=`<text x="${x(ts).toFixed(1)}" y="${CH-6}" class="xa">${d.getMonth()+1}/${d.getDate()}</text>`; }
  const dots=days.map(d=>`<g data-tip="${esc(d.tip)}"><circle cx="${x(d.ts).toFixed(1)}" cy="${y(d.a).toFixed(1)}" r="12" fill="transparent"/><circle class="dot hl b" cx="${x(d.ts).toFixed(1)}" cy="${y(d.b).toFixed(1)}" r="3.5"/><circle class="dot hl a" cx="${x(d.ts).toFixed(1)}" cy="${y(d.a).toFixed(1)}" r="3.5"/></g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img">${gridY(lo,hi,st,y)}<path class="ln b" d="${path("b")}"/><path class="ln a" d="${path("a")}"/>${dots}${xl}</svg>`;
}
const e1rm = s=> s.r>1? s.w*(1+s.r/30) : s.w;

    pts.forEach(p=>p.v/=60000); bars(pts,v=>fmtHM(v*60000),t("sumTotal",{v:fmtHM(tot)})+" · "+t("sumAvg",{v:fmtHM(tot/Math.max(1,n))})); }

// ---------- tick ----------
function tick(){
  const tm=T(); const now=Date.now();
  const el = id=>document.getElementById(id);
  if(autoClose(now)){ save({}); if(view.name==="list"||view.name==="history") return render(); }
  const vc=el("visitClock"); const ox=openSession(); if(vc&&ox) vc.textContent = fmtLong(((tm.phase==="idle"?ox.end:now) - ox.start)/1000);
  const vk=el("visitKcal"); if(vk&&ox) vk.textContent = kcalTxt(sessionKcal(ox, tm.phase==="idle"?ox.end:now));
  const onMine = view.name==="ex" && tm.exId===view.ex;
  if(tm.phase==="rest"){
    const sec=(now-tm.start)/1000, target=S.settings.rest;
    if(!tm.beeped && sec>=target){ tm.beeped=true; beep(3); save({sync:false}); }
    if(sec>15*60){ endRest(); return; }
    const rs=el("sheetRest"); if(rs) rs.textContent=t("restNow",{t:fmt(sec)});
  }
  if(onMine){
    const c=el("clock"); if(c) c.textContent = tm.phase==="idle"?"0:00":fmt((now-tm.start)/1000);
    if(tm.phase==="rest"){
      const sec=(now-tm.start)/1000, target=S.settings.rest, left=target-sec;
      const bar=el("restbar"); if(bar) bar.style.width = Math.min(100,sec/target*100)+"%";
      const info=el("restinfo"); if(info) info.textContent = left>0? t("goalLeft",{t:fmt(target),l:fmt(Math.ceil(left))}) : t("goalOver",{t:fmt(target),l:fmt(-left)});
      const tmEl=el("timer"); if(tmEl) tmEl.classList.toggle("over", left<=0);
    }
  }
  document.body.classList.toggle("ph-work", tm.phase==="work");
  document.body.classList.toggle("ph-rest", tm.phase==="rest");
  const pill=document.getElementById("pill");
  if(tm.phase!=="idle" && !onMine){
    const e=exById(tm.exId); pill.hidden=false; pill.className="pill"+(tm.phase==="work"?" work":"");
    const sec=(now-tm.start)/1000;
    const label = tm.phase==="work"? t("working") : t("resting");
    pill.innerHTML = `<span>${esc(exName(e))} · ${label}</span><span class="num">${fmt(sec)}</span>`;
    pill.dataset.ex = tm.exId;
  } else pill.hidden=true;
}

// ---------- merge & cloud sync ----------
const deletedEx = new Set(S.deletedEx||[]);
function mergeIn(p){
  if(!p) return;
  const del = new Set([...(S.deleted||[]), ...(p.deleted||[])]);
  (p.deletedEx||[]).forEach(id=>deletedEx.add(id)); S.deletedEx=[...deletedEx];
  const sets = new Map(S.sets.map(s=>[s.id,s]));
  for(const s of (p.sets||[])){ if(!s||!s.id) continue; const cur=sets.get(s.id); if(!cur || (s.u||0)>(cur.u||0)) sets.set(s.id, Object.assign({},s)); }
  S.sets = [...sets.values()].filter(s=>!del.has(s.id));
  S.deleted = [...del].slice(-2000);
  const exs = new Map(S.exercises.map(e=>[e.id,e]));
  for(const e of (p.exercises||[])){ if(!e||!e.id) continue; const cur=exs.get(e.id); if(!cur || (e.u||0)>(cur.u||0)) exs.set(e.id, Object.assign({},e)); }
  S.exercises = [...exs.values()].filter(e=>!deletedEx.has(e.id));
  const ses = new Map(S.sessions.map(x=>[x.id,x]));
  for(const x of (p.sessions||[])){ if(!x||!x.id) continue; const cur=ses.get(x.id); if(!cur || (x.u||0)>(cur.u||0)) ses.set(x.id, Object.assign({},x)); }
  S.sessions = [...ses.values()];
  const gm = new Map((S.gyms||[]).map(g=>[g.id,g]));
  for(const g of (p.gyms||[])){ if(g&&g.id&&!gm.has(g.id)) gm.set(g.id, Object.assign({},g)); }
  S.gyms=[...gm.values()];
  const sa = new Map((S.saunas||[]).map(x=>[x.id,x]));
  for(const x of (p.saunas||[])){ if(!x||!x.id) continue; const cur=sa.get(x.id); if(!cur || (x.u||0)>(cur.u||0)) sa.set(x.id, Object.assign({},x)); }
  S.saunas=[...sa.values()].filter(x=>!del.has(x.id));
  if(!S.settings.lang && p.lang) S.settings.lang=p.lang;
  if((p.profU||0)>(S.settings.profU||0)){ S.settings.sex=p.sex||null; S.settings.ht=p.ht||null; S.settings.birth=p.birth||null; S.settings.profU=p.profU; }
  if(p.nick && (p.nickU||0)>(S.settings.nickU||0)){ S.settings.nick=p.nick; S.settings.nickU=p.nickU||0; }
  if(p.bw && (p.bwU||0)>(S.settings.bwU||0)){ S.settings.bw=p.bw; S.settings.bwU=p.bwU||0; }
  if(p.last) for(const k in p.last) if(!S.last[k]) S.last[k]=p.last[k];
}

const sync = {on:false, err:false, col:null, timer:null, busy:false};
function scheduleSync(){ if(!sync.on) return; clearTimeout(sync.timer); sync.timer=setTimeout(push, 1500); }
async function push(){
  if(!sync.on) return;
  if(sync.busy){ scheduleSync(); return; }
  sync.busy=true;
  try{
    const months=[...dirtyMonths]; dirtyMonths.clear();
    for(const m of months){ await sync.col.doc("m-"+m).set({sets: S.sets.filter(s=>monthKey(s.t)===m)}); }
    if(metaDirty || months.length){ metaDirty=false;
      await sync.col.doc("meta").set({exercises:S.exercises, sessions:S.sessions, saunas:S.saunas, gyms:S.gyms, lang:S.settings.lang||null, bw:S.settings.bw||null, bwU:S.settings.bwU||0, nick:S.settings.nick||null, nickU:S.settings.nickU||0, sex:S.settings.sex||null, ht:S.settings.ht||null, birth:S.settings.birth||null, profU:S.settings.profU||0, deleted:S.deleted, deletedEx:S.deletedEx||[], last:S.last, u:Date.now()}); }
    sync.err=false;
  }catch(e){ sync.err=true; metaDirty=true; setTimeout(scheduleSync, 15000); }
  sync.busy=false;
}
(async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(user){ try{ const me=await user.me(); viewerName=(me&&me.name)||""; drawEntry(); }catch(e){} }
    if(!db || !user) return;
    const me = await user.id(); if(!me) return;
    sync.col = db.collection("data/users/"+me);
    const snap = await sync.col.get();
    const remote = {sets:[], sessions:[], exercises:[], deleted:[], deletedEx:[], last:null};
    for(const doc of snap.docs){ const d=doc.data()||{};
      if(doc.id==="meta"){ remote.exercises=d.exercises||[]; remote.sessions=d.sessions||[]; remote.gyms=d.gyms||[]; remote.saunas=d.saunas||[]; remote.lang=d.lang||null; remote.bw=d.bw||null; remote.bwU=d.bwU||0; remote.nick=d.nick||null; remote.nickU=d.nickU||0; remote.sex=d.sex||null; remote.ht=d.ht||null; remote.birth=d.birth||null; remote.profU=d.profU||0; remote.deleted=d.deleted||[]; remote.deletedEx=d.deletedEx||[]; remote.last=d.last||null; }
      else if(doc.id.startsWith("m-")) remote.sets.push(...(d.sets||[])); }
    const remoteIds = new Set(remote.sets.map(s=>s.id));
    mergeIn(remote);
    sync.on = true; drawEntry();
    for(const s of S.sets) if(!remoteIds.has(s.id)) dirtyMonths.add(monthKey(s.t));
    metaDirty = true;
    save({sync:false}); scheduleSync(); render();
  }catch(e){ sync.on=false; }
})();

function calEnd(x){ return Math.max(x.end, x.start+5*60000); }
function calLink(x){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t("calSummary"))+"&dates="+utcStamp(x.start)+"/"+utcStamp(calEnd(x))+"&details="+encodeURIComponent(calText(x))+(gymName(x)?"&location="+encodeURIComponent(gymName(x)):"");
}
let mcpP=null;
async function addToCalendar(x){
  if(!window.claude){ window.open(calLink(x), "_blank"); x.cal=true; x.u=Date.now(); save({}); if(view.name==="history") render(); return; }
  const fail = msg=>{ calFail[x.id]=msg; if(view.name==="history") render(); toast(msg+t("calManual")); };
  try{
    if(!window.claude || !window.claude.use) return fail(t("calNoEnv"));
    mcpP = mcpP || window.claude.use("mcp");
    const mcp = await mcpP; if(!mcp) return fail(t("calNoCap"));
    const res = await mcp.callTool("Google Calendar","create_event",Object.assign({summary:t("calSummary"), startTime:isoLocal(x.start), endTime:isoLocal(calEnd(x)), description:calText(x)}, gymName(x)?{location:gymName(x)}:{}));
    const p = res && res.payload; x.cal = (p && (p.id || (p.event&&p.event.id))) || true; x.u=Date.now(); delete calFail[x.id];
    save({}); render(); toast(t("calOk"));
  }catch(e){
    const code = e && e.code;
    fail(code==="server_not_connected"||code==="server_not_found" ? t("calNotConn")
      : code==="needs_reauth" ? t("calReauth")
      : code==="not_granted"||code==="consent_required" ? t("calDenied") : t("calErr"));
  }
}

drawEntry();
render();
})();
</script>
