<title>ジムログ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* Layout: one-column phone app, committed to a single dark look: black iron with violet light. Start = violet, Stop = hot pink, rest = deep violet glow. */
:root{
  color-scheme:dark;
  --bg:#08070b; --surface:#141119; --surface2:#1f1a28; --line:#2d2639; --ink:#f2eff8; --muted:#9b92ab;
  --violet:#8b5cf6; --violet-hi:#b69cff; --violet-deep:#2a1752; --violet-ink:#ffffff;
  --pink:#ec4f86; --pink-ink:#ffffff; --ok:#6fd6a0;
  --glow:0 0 0 1px rgba(139,92,246,.35),0 8px 30px rgba(139,92,246,.25);
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.02em;margin:4px 0 2px;text-wrap:balance;line-height:1.15}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}

/* entry screen */
.entry{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.entry svg.hero{position:absolute;inset:0;width:100%;height:100%}
.entry .content{position:relative;margin-top:auto;padding:0 max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;align-self:center;box-sizing:border-box}
.entry .brand{font-family:var(--display);font-size:64px;line-height:.9;letter-spacing:.02em;margin:0}
.entry .brand span{color:var(--violet-hi);text-shadow:0 0 24px rgba(139,92,246,.7)}
.entry .lede{color:#cfc6e2;font-size:15px;margin:0}
.entry .who{font-size:13px;color:var(--muted)}

// ---------- state ----------
function blank(){
  const lang=null; // chosen on first launch
  return {gyms:[], exercises: DEFAULT_EX.map(([id,name,en,type,part],i)=>({id,name,type,part,o:i,u:0})),
    sets:[], sessions:[], deleted:[], last:{}, settings:{rest:90, autoCal:true, lang}, timer:{phase:"idle"}};
}
let S = blank();
try{
  const raw = localStorage.getItem(LS);
  if(raw){ const p = JSON.parse(raw); const b=blank(); S = Object.assign(b, p);
    const have = new Set(S.exercises.map(e=>e.id));
    b.exercises.forEach(e=>{ if(!have.has(e.id)) S.exercises.push(e); });
    S.settings = Object.assign({rest:90, autoCal:true, lang:null}, S.settings||{}); S.sessions = S.sessions||[]; S.gyms = S.gyms||[];
    S.timer = S.timer||{phase:"idle"}; S.last = S.last||{}; S.deleted = S.deleted||[];
  }
}catch(e){}

function t(k, v){ let s = (I18N[S.settings.lang||"ja"]||I18N.ja)[k]; if(s==null) s = I18N.ja[k]||k; if(v) for(const n in v) s = s.split("{"+n+"}").join(v[n]); return s; }
const isJa = ()=> S.settings.lang!=="en";
function exName(e){ if(!e) return t("removedEx"); return (!isJa() && !e.custom && EN_NAME[e.id]) ? EN_NAME[e.id] : e.name; }
function partName(p){ return isJa()? p : (PART_EN[p]||p); }
const typeName = ty => t(ty);

const dirtyMonths = new Set(); let metaDirty = false;
function save(opts){
  try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){}
  if(opts && opts.sync!==false){ metaDirty = true; scheduleSync(); }
}
function touchSet(s){ s.u = Date.now(); dirtyMonths.add(monthKey(s.t)); }

const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad = n=> String(n).padStart(2,"0");
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function monthKey(ts){ const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1); }
function fmt(sec){ sec=Math.max(0,Math.floor(sec)); const m=Math.floor(sec/60), s=sec%60; return m+":"+pad(s); }
function fmtKg(w){ return (Math.round(w*100)/100).toString(); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const exById = id => S.exercises.find(e=>e.id===id);
const todayKey = ()=> dayKey(Date.now());
function dayLabel(k){ const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d);
  try{ return dt.toLocaleDateString(isJa()?"ja-JP":"en-US", isJa()?{month:"long",day:"numeric",weekday:"short"}:{weekday:"short",month:"short",day:"numeric"}); }catch(e){ return k; } }
function ago(ts){ const days = Math.round((new Date(todayKey()) - new Date(dayKey(ts)))/86400000); return days<=0?t("today"):days===1?t("yesterday"):t("daysAgo",{n:days}); }
function repTxt(r){ return isJa()? r+"回" : r+" reps"; }

// ---------- gym visits (first Start to last Stop) ----------
const GAP = 3*3600*1000; // a pause longer than 3 hours starts a new visit
function openSession(){ return S.sessions.find(x=>!x.closed); }
function autoClose(now){
  let changed=false;
  for(const x of S.sessions) if(!x.closed && now - x.end > GAP && S.timer.phase==="idle"){ x.closed=true; x.u=now; changed=true; }
  return changed;
}
function sessionFor(now){
  autoClose(now);
  let x = openSession();
  if(!x){ x={id:uid(), start:now, end:now, closed:false, cal:null, gym:S.currentGym||null, u:now}; S.sessions.push(x); }
  return x;
}
const gymById = id => S.gyms.find(g=>g.id===id);
function gymName(x){ const g=x&&x.gym&&gymById(x.gym); return g?g.name:""; }
function chooseGym(id){
  S.currentGym=id; const x=openSession(); if(x){ x.gym=id; x.u=Date.now(); }
  save({}); render(); const g=gymById(id); if(g) toast(t("gymSel",{name:g.name}));
}
function gymsSorted(){
  const n={}; for(const x of S.sessions) if(x.gym) n[x.gym]=(n[x.gym]||0)+1;
  return S.gyms.map(g=>({g,n:n[g.id]||0})).sort((a,b)=>b.n-a.n||(b.g.u||0)-(a.g.u||0));
}
function askGym(){
  const list=gymsSorted();
  sheet.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(t("gymQ"))}">
    <h3>${t("gymQ")}</h3>
    ${list.length?`<div class="sub">${t("savedHead")}</div><div class="gymlist">${list.map(x=>`<button class="gymrow" data-gym="${x.g.id}">${esc(x.g.name)}<small>${x.n?t("visitsN",{n:x.n}):""}</small></button>`).join("")}</div>`:""}
    <div class="sub">${t("nearHead")}</div>
    <div class="gymlist" id="nearList"><div class="note" style="margin:0">${t("nearSearching")}</div></div>
    <div class="sub">${t("typeHead")}</div>
    <div class="row"><input id="gn" class="gyminput" placeholder="${esc(t("gymNamePh"))}" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px;font-size:16px;color:var(--ink)"><button class="btn primary" id="gadd">${t("gymReg")}</button></div>
    <button class="btn" data-act="close">${t("gymSkip")}</button>
  </div></div>`;
  sheet.querySelectorAll("[data-gym]").forEach(b=>b.onclick=()=>{ const g=gymById(b.dataset.gym); if(g&&g.lat==null&&lastPos){ g.lat=lastPos.lat; g.lon=lastPos.lon; } closeSheet(); chooseGym(b.dataset.gym); });
  autoGym();
  const gn=sheet.querySelector("#gn");
  gn.addEventListener("paste", ev=>{
    const txt=(ev.clipboardData||window.clipboardData)?.getData("text")||""; const p=parseMapsShare(txt);
    if(p.url||p.name){ ev.preventDefault(); gn.value=p.name; gn.dataset.url=p.url||""; }
  });
  gn.addEventListener("input", ()=>{ if(/https?:\/\//.test(gn.value)){ const p=parseMapsShare(gn.value); gn.value=p.name; gn.dataset.url=p.url||""; } });
  sheet.querySelector("#gadd").onclick=()=>{
    const name=gn.value.trim(); if(!name){ gn.focus(); return; }
    const g=Object.assign({id:"g"+uid(), name, url:gn.dataset.url||"", u:Date.now()}, lastPos?{lat:lastPos.lat, lon:lastPos.lon}:{}); S.gyms.push(g); closeSheet(); chooseGym(g.id);
  };
}
// ---------- nearby gyms ----------
let nearCache=null; // {at, items}
function distM(a,b,c,d){ const R=6371000, r=Math.PI/180, x=(d-b)*r*Math.cos((a+c)/2*r), y=(c-a)*r; return Math.round(Math.sqrt(x*x+y*y)*R); }
function fmtDist(m){ return m<1000? m+"m" : (m/1000).toFixed(1)+"km"; }
// quick, coarse fix first (works indoors); fall back to GPS if that times out
const within = (p, ms, err) => Promise.race([p, new Promise((_,ng)=>setTimeout(()=>ng(err), ms))]);
function getPos(){
  const once = o => within(new Promise((ok,ng)=>navigator.geolocation.getCurrentPosition(p=>ok(p.coords), ng, o)), o.timeout+5000, {code:3});
  if(!navigator.geolocation) return Promise.reject({code:2});
  return once({enableHighAccuracy:false, timeout:10000, maximumAge:60000})
    .catch(e=> e && e.code===1 ? Promise.reject(e) : once({enableHighAccuracy:true, timeout:20000, maximumAge:60000}));
}
// gyms are tagged inconsistently in OpenStreetMap (especially in Japan), so match tags and common names; ask all servers at once
async function overpass(lat, lon){
  const a=`(around:3000,${lat},${lon})`;
  const q = `[out:json][timeout:15];(nwr["leisure"="fitness_centre"]${a};nwr["amenity"="gym"]${a};nwr["leisure"="sports_centre"]["name"]${a};);out center 80;`;
  const hosts = ["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.private.coffee/api/interpreter"];
  const one = h => new Promise((ok,ng)=>{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),30000);
    fetch(h, {method:"POST", body:"data="+encodeURIComponent(q), headers:{"Content-Type":"application/x-www-form-urlencoded"}, signal:ctl.signal})
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }).then(j=>{ clearTimeout(tm); ok(j.elements||[]); }).catch(e=>{ clearTimeout(tm); ng(e); }); });
  return within(new Promise((ok,ng)=>{ let left=hosts.length, last; hosts.forEach(h=>one(h).then(ok, e=>{ last=e; if(--left===0) ng(last); })); }), 35000, {slow:true});
}
let lastPos=null;
// GPS → the nearest saved gym within 500 m is selected without asking (no map server involved)
async function autoGym(){
  const box=()=>sheet.querySelector("#nearList"), paint=h=>{ const b=box(); if(b) b.innerHTML=h; }, note=x=>`<div class="note" style="margin:0">${x}</div>`;
  paint(note(t("nearLocating")));
  try{
    const c=await getPos(); lastPos={lat:c.latitude, lon:c.longitude};
    const near=S.gyms.filter(g=>g.lat!=null).map(g=>({g, d:distM(c.latitude,c.longitude,g.lat,g.lon)})).sort((x,y)=>x.d-y.d)[0];
    if(near && near.d<=500){ if(box()){ closeSheet(); chooseGym(near.g.id); } return; }
    paint(note(t("autoNone"))+mapsLink(c.latitude,c.longitude));
  }catch(e){
    paint(note(e&&e.code===1 ? t("nearDenied") : t("nearNoPos"))+`<button class="btn" id="nearAgain">${t("nearRetry")}</button>`);
    const r=sheet.querySelector("#nearAgain"); if(r) r.onclick=autoGym;
  }
}
function mapsLink(lat, lon){ return `<a class="maplink" href="https://www.google.com/maps/search/${encodeURIComponent(isJa()?"ジム":"gym")}${lat!=null?`/@${lat},${lon},15z`:""}" target="_blank" rel="noopener">${t("nearMaps")}</a>`; }
async function nominatim(lat, lon){
  const d=0.03, vb=[lon-d,lat+d,lon+d,lat-d].join(","), out=[];
  for(const q of ["ジム","フィットネス","gym"]){
    try{ const r=await within(fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=20&bounded=1&viewbox=${vb}&accept-language=${isJa()?"ja":"en"}&q=${encodeURIComponent(q)}`),12000,new Error("timeout"));
      if(r.ok) for(const x of await r.json()) out.push({lat:+x.lat, lon:+x.lon, tags:{name:x.name||String(x.display_name||"").split(",")[0]}}); }catch(e){}
  }
  return out;
}
async function findGyms(lat, lon){
  const [o, n] = await Promise.allSettled([overpass(lat, lon), nominatim(lat, lon)]);
  const all = [...(o.status==="fulfilled"?o.value:[]), ...(n.status==="fulfilled"?n.value:[])];
  if(!all.length && o.status==="rejected") throw o.reason;
  return all;
}
async function showNearby(force){
  const box = () => sheet.querySelector("#nearList");
  const paint = html => { const b=box(); if(b) b.innerHTML=html; };
  try{
    let lat, lon, items;
    if(!force && nearCache && Date.now()-nearCache.at < 10*60000) ({lat,lon,items}=nearCache);
    else {
      paint(`<div class="note" style="margin:0">${t("nearLocating")}</div>`);
      const c = await getPos(); lat=c.latitude; lon=c.longitude; var acc=Math.round(c.accuracy||0);
      paint(`<div class="note" style="margin:0">${t("nearQuerying",{acc})}</div>`);
      const seen = new Set();
      items = (await findGyms(lat, lon)).map(e=>{ const tg=e.tags||{}; const la=e.lat??e.center?.lat, lo=e.lon??e.center?.lon;
          const name=(isJa()? tg["name:ja"]||tg.name : tg["name:en"]||tg.name)||""; const br=tg["branch:ja"]||tg.branch||"";
          return {name: br && !name.includes(br) ? name+" "+br : name, lat:la, lon:lo}; })
        .filter(x=>x.name && x.lat!=null && !seen.has(x.name) && seen.add(x.name))
        .map(x=>Object.assign(x,{d:distM(lat,lon,x.lat,x.lon)})).sort((a,b)=>a.d-b.d).slice(0,15);
      if(items.length) nearCache = {at:Date.now(), lat, lon, items};
    }
    if(!items.length){ paint(`<div class="note" style="margin:0">${t("nearNone",{acc:typeof acc==="number"?acc:"?"})}</div>${mapsLink(lat,lon)}`); return; }
    paint(items.map((x,i)=>`<button class="gymrow" data-near="${i}">${esc(x.name)}<small>${fmtDist(x.d)}</small></button>`).join(""));
    box()?.querySelectorAll("[data-near]").forEach(b=>b.onclick=()=>{
      const x=items[+b.dataset.near]; let g=S.gyms.find(y=>y.name===x.name);
      if(!g){ g={id:"g"+uid(), name:x.name, lat:x.lat, lon:x.lon, u:Date.now()}; S.gyms.push(g); }
      closeSheet(); chooseGym(g.id);
    });
  }catch(e){
    const pos = e && (e.code===1||e.code===2||e.code===3);
    paint(`<div class="note" style="margin:0">${e&&e.code===1 ? t("nearDenied") : pos ? t("nearNoPos") : e&&e.slow ? t("nearSlow") : t("nearErr")+(e&&e.message?` <span style="opacity:.6">(${esc(e.message)})</span>`:"")}</div><button class="btn" id="nearAgain">${t("nearRetry")}</button>${mapsLink()}`);
    const a=sheet.querySelector("#nearAgain"); if(a) a.onclick=()=>showNearby(true);
  }
}
// Google Maps "Share → Copy" gives the place name (sometimes with address) followed by a maps.app.goo.gl link
function parseMapsShare(txt){
  const m = txt.match(/https?:\/\/\S+/); const url = m ? m[0] : "";
  const lines = txt.replace(url,"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  let name = lines[0] || "";
  // a single-line field turns the newlines into spaces, so also cut where a Japanese address starts
  const cut = name.search(/\s(〒|東京都|北海道|(京都|大阪)府|\S{2,3}県)/); if(cut>0) name=name.slice(0,cut);
  name = name.replace(/^[「『"]|[」』"]$/g,"").replace(/\s*[-–]\s*Google\s*(マップ|Maps)$/i,"").trim();
  return {name, url};
}
function fmtHM(ms){ const m=Math.max(0,Math.round(ms/60000)); const h=Math.floor(m/60); return h? t("h",{h,m:m%60}) : t("m",{m}); }
function fmtLong(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600); return h? h+":"+pad(Math.floor(sec%3600/60))+":"+pad(sec%60) : fmt(sec); }
function clock(ts){ const d=new Date(ts); return d.getHours()+":"+pad(d.getMinutes()); }
function sessionSets(x){ return S.sets.filter(s=>s.sid===x.id).sort((a,b)=>a.t-b.t); }
function setsTxt(sets){ return isCardio(exById(sets[0]&&sets[0].ex)) ? sets.map(s=>fmt(s.d||0)).join(", ") : sets.map(s=>fmtKg(s.w)+"×"+s.r).join(", "); }
function groupByEx(list){
  const g=[], idx={};
  for(const s of list){ if(!(s.ex in idx)){ idx[s.ex]=g.length; g.push({ex:s.ex,sets:[]}); } g[idx[s.ex]].sets.push(s); }
  return g;
}

// usage frequency: number of distinct days an exercise was done; ties go to the more recent one
function usage(){
  const m = {};
  for(const s of S.sets){ const u = m[s.ex] || (m[s.ex]={days:new Set(),last:0,today:0});
    u.days.add(dayKey(s.t)); if(s.t>u.last) u.last=s.t; if(dayKey(s.t)===todayKey()) u.today++; }
  return m;
}
function sortedExercises(pred){
  const u = usage();
  return S.exercises.filter(e=>!e.hidden && pred(e))
    .map(e=>({e, n:u[e.id]?u[e.id].days.size:0, last:u[e.id]?u[e.id].last:0, today:u[e.id]?u[e.id].today:0}))
    .sort((a,b)=> b.n-a.n || b.last-a.last || a.e.o-b.e.o);
}

// body parts of one type, most trained first (distinct days), then the usual order
function partsFor(type){
  const days={}, today={};
  for(const s of S.sets){ const e=exById(s.ex); if(!e||e.type!==type) continue; (days[e.part] ||= new Set()).add(dayKey(s.t)); if(dayKey(s.t)===todayKey()) today[e.part]=(today[e.part]||0)+1; }
  const parts=[...new Set(S.exercises.filter(e=>!e.hidden&&e.type===type).map(e=>e.part))];
  return parts.map(p=>({p, n:days[p]?days[p].size:0, today:today[p]||0, count:S.exercises.filter(e=>!e.hidden&&e.type===type&&e.part===p).length}))
    .sort((a,b)=> b.n-a.n || PARTS.indexOf(a.p)-PARTS.indexOf(b.p));
}
const isCardio = e => e && e.type==="cardio";

// ---------- estimated calories: METs × body weight (kg) × hours (Compendium of Physical Activities) ----------
const MET_STRENGTH = 3.5; // resistance training, general: gym time that isn't cardio
const MET_CARDIO = {treadmill:6.0, bike:7.0, elliptical:5.0, rowing:7.0, stairs:9.0};
const MET_CARDIO_OTHER = 6.0;
const bodyKg = ()=> S.settings.bw || 65;
const kcalOf = (met, sec)=> met*bodyKg()*sec/3600;
function sessionKcal(x, until){
  const sets = sessionSets(x); let cardio=0, kc=0, strengthSets=0;
  for(const s of sets){ if(isCardio(exById(s.ex))){ cardio += s.d||0; kc += kcalOf(MET_CARDIO[s.ex]||MET_CARDIO_OTHER, s.d||0); } else strengthSets++; }
  const stay = ((until||x.end) - x.start)/1000;
  // sets logged without timing leave no stay time, so count at least 90 s per set
  return kc + kcalOf(MET_STRENGTH, Math.max(stay - cardio, strengthSets*90, 0));
}
function dayKcal(k){ return S.sessions.filter(x=>dayKey(x.start)===k).reduce((a,x)=>a+sessionKcal(x),0); }
const kcalTxt = k=> t("kcal",{k:Math.round(k).toLocaleString()});
const nav = {cat:null, part:null};

// ---------- audio / wake lock ----------
let actx=null;
function unlockAudio(){ try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(times){
  if(!actx) return;
  for(let i=0;i<times;i++){ const o=actx.createOscillator(), g=actx.createGain(); const tt=actx.currentTime+i*0.28;
    o.frequency.value=880; o.type="sine"; g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(0.35,tt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.2);
    o.connect(g).connect(actx.destination); o.start(tt); o.stop(tt+0.22); }
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
let wake=null;
async function keepAwake(){ try{ if("wakeLock" in navigator && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null;}); } }catch(e){} }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.timer.phase!=="idle") keepAwake(); });

// ---------- timer logic ----------
const T = ()=> S.timer;
function closeRest(now, exId){
  const tm=T(); if(tm.phase!=="rest" || (exId && tm.exId!==exId)) return;
  const s = S.sets.find(x=>x.id===tm.setId);
  if(s){ s.rest = Math.round((now - tm.start)/1000); touchSet(s); }
}
function startSet(exId){
  unlockAudio(); const now=Date.now(); closeRest(now, exId); sessionFor(now); closeSheet();
  S.timer = {phase:"work", exId, start:now}; keepAwake(); save({}); render();
}
// Stop: the set is logged with the weight chosen before Start, then the reps sheet opens while the rest timer runs
function stopSet(askReps){
  const tm=T(); if(tm.phase!=="work") return null; const now=Date.now();
  const s = logSet(tm.exId, Math.round((now-tm.start)/1000), tm.start);
  const x = sessionFor(now); x.end=now; x.u=now; s.sid=x.id;
  if(isCardio(exById(tm.exId))){ s.w=0; s.r=0; S.timer={phase:"idle"}; save({}); render(); toast(t("cardioDone",{name:exName(exById(s.ex)), t:fmt(s.d)})+" · "+kcalTxt(kcalOf(MET_CARDIO[s.ex]||MET_CARDIO_OTHER, s.d))); return s; }
  S.timer = {phase:"rest", exId:tm.exId, start:now, setId:s.id, beeped:false}; save({}); render();
  if(askReps!==false) askRepsFor(s.id);
  return s;
}
function quickLog(exId){
  unlockAudio(); const now=Date.now(); closeRest(now, exId);
  const s = logSet(exId, null, now);
  const x = sessionFor(now); x.end=now; x.u=now; s.sid=x.id;
  S.timer = {phase:"rest", exId, start:now, setId:s.id, beeped:false}; keepAwake(); save({}); render();
  askRepsFor(s.id);
}
function endRest(){ closeRest(Date.now()); S.timer={phase:"idle"}; save({}); render(); }
// "Finish exercise": the time after the last set is not a rest
function finishExercise(){
  const tm=T(); const exId=tm.exId||view.ex;
  const wasWork = tm.phase==="work";
  const s = wasWork ? stopSet(false) : null;
  S.timer={phase:"idle"}; save({});
  view={name:"list",filter:view.filter||"all"}; window.scrollTo(0,0); render();
  if(s) askRepsFor(s.id, true);
  else toast(t("finished",{name:exName(exById(exId)), n:S.sets.filter(x=>x.ex===exId && dayKey(x.t)===todayKey()).length}));
}
function endGym(){
  const x=openSession(); if(!x) return;
  if(S.timer.phase==="work") stopSet(false);
  S.timer={phase:"idle"}; x.closed=true; x.u=Date.now(); S.currentGym=null; save({}); render();
  toast(t("gymDone",{d:fmtHM(x.end-x.start), n:sessionSets(x).length})+" · "+kcalTxt(sessionKcal(x)));
  if(S.settings.autoCal) addToCalendar(x);
}
function logSet(exId, dur, ts){
  const v = vals(exId);
  const s = {id:uid(), ex:exId, w:v.w, r:v.r, t:ts, d:dur, rest:null};
  touchSet(s); S.sets.push(s); return s;
}
function vals(exId){
  const e = exById(exId); const l = S.last[exId];
  return Object.assign({w:20, r:10, step: e&&e.type==="machine"?5:2.5}, l||{});
}
function setVals(exId, patch){ S.last[exId] = Object.assign({}, vals(exId), patch); save({}); }

// ---------- views ----------
let view = {name:"list", filter:"all"};
const app = document.getElementById("app");

function render(){
  document.documentElement.lang = S.settings.lang;
  document.querySelectorAll("[data-i]").forEach(el=>el.textContent=t(el.dataset.i));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===(view.name==="ex"?"list":view.name)));
  if(view.name==="list") renderList();
  else if(view.name==="ex") renderEx();
  else if(view.name==="history") renderHistory();
  else renderSettings();
  tick();
}

function exRow(x,i,showType){
  return `<button class="ex" data-ex="${esc(x.e.id)}">
    <span class="rank">${x.n?i+1:""}</span>
    <span class="info"><div class="name">${esc(exName(x.e))}</div>
      <div class="meta"><span class="tag ${x.e.type}"></span>${[showType||x.e.type==="cardio"?typeName(x.e.type):"", x.e.type==="cardio"?"":esc(partName(x.e.part)), x.n?t("nTimes",{n:x.n}):"", x.n?ago(x.last):""].filter(Boolean).join(" · ")}</div></span>
    ${x.today?`<span class="today">${t("todayN",{n:x.today})}</span>`:""}
  </button>`;
}
function renderList(){
  const todaySets = S.sets.filter(s=>dayKey(s.t)===todayKey()).length;
  const ox = openSession();
  if(!nav.cat) nav.cat = S.sets.length? "freq" : "machine";
  let body="";
  if(nav.cat==="freq"){
    const items = sortedExercises(()=>true).filter(x=>x.n>0).slice(0,12);
    body = items.length? `<div class="list">${items.map((x,i)=>exRow(x,i,true)).join("")}</div>` : `<div class="card empty" style="margin-top:12px">${t("freqEmpty")}</div>`;
  } else if(nav.cat==="cardio"){
    body = `<div class="list">${sortedExercises(e=>e.type==="cardio").map((x,i)=>exRow(x,i)).join("") || `<div class="empty" style="padding:14px">${t("noEx")}</div>`}</div>`;
  } else if(!nav.part){
    const parts = partsFor(nav.cat);
    body = `<div class="sub" style="margin-top:14px">${t("pickPart")}</div><div class="parts">${parts.map(x=>`<button class="partbtn" data-part="${esc(x.p)}">
      <span class="pn">${esc(partName(x.p))}</span><span class="pm">${t("exN",{n:x.count})}${x.n?" · "+t("nTimes",{n:x.n}):""}</span>${x.today?`<span class="today">${t("todayN",{n:x.today})}</span>`:""}</button>`).join("")}</div>`;
  } else {
    const items = sortedExercises(e=>e.type===nav.cat && e.part===nav.part);
    body = `<div class="row" style="margin-top:12px"><button class="back" data-act="parts">${t("allParts")}</button><span class="spacer"></span><b>${esc(partName(nav.part))}</b></div>
      <div class="list" style="margin-top:4px">${items.map((x,i)=>exRow(x,i)).join("") || `<div class="empty" style="padding:14px">${t("noEx")}</div>`}</div>`;
  }

// ---------- charts (inline SVG, no libraries) ----------
const hist = {mode:"list", metric:"ex", period:90, ex:null};
const DAY = 86400000;
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function bucketOf(ts, unit){ const d=new Date(startOfDay(ts)); if(unit==="week") d.setDate(d.getDate()-((d.getDay()+6)%7)); else if(unit==="month") d.setDate(1); return d.getTime(); }
function nextBucket(b, unit){ const d=new Date(b); if(unit==="day") d.setDate(d.getDate()+1); else if(unit==="week") d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1); return d.getTime(); }
function chartRange(){
  const to=Date.now(); let from;
  if(hist.period) from = startOfDay(to-(hist.period-1)*DAY);
  else { from = to; for(const s of S.sets) if(s.t<from) from=s.t; for(const x of S.sessions) if(x.start<from) from=x.start; from=startOfDay(from); }
  const span=(to-from)/DAY;
  return {from, to, span, unit: span<=45?"day" : span<=200?"week" : "month"};
}
function bucketLabel(b, unit, long){
  const d=new Date(b);
  if(unit==="month") return isJa()? (long? d.getFullYear()+"年"+(d.getMonth()+1)+"月" : (d.getMonth()+1)+"月") : d.toLocaleDateString("en-US", long?{month:"short",year:"numeric"}:{month:"short"});
  if(long) return unit==="week"? t("weekOf",{d:(d.getMonth()+1)+"/"+d.getDate()}) : dayLabel(dayKey(b));
  return (d.getMonth()+1)+"/"+d.getDate();
}
// sum valFn(item) per bucket, empty buckets included
function perBucket(r, items, tsFn, valFn){
  const bs=[]; for(let b=bucketOf(r.from,r.unit); b<=r.to; b=nextBucket(b,r.unit)) bs.push(b);
  const idx=new Map(bs.map((b,i)=>[b,i])), v=bs.map(()=>0);
  for(const it of items){ const ts=tsFn(it); if(ts<r.from||ts>r.to) continue; const i=idx.get(bucketOf(ts,r.unit)); if(i!=null) v[i]+=valFn(it); }
  return bs.map((b,i)=>({b, v:v[i], label:bucketLabel(b,r.unit), long:bucketLabel(b,r.unit,true)}));
}
function niceStep(span, n){ const raw=span/n; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function fmtAxis(v){ return v>=10000? Math.round(v/100)/10+"k" : String(Math.round(v*10)/10); }
const CW=340, CH=190, CL=40, CR=8, CT=12, CB=24;
function gridY(lo, hi, st, y){ let g=""; for(let v=lo; v<=hi+st/1000; v+=st) g+=`<line x1="${CL}" x2="${CW-CR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${CL-6}" y="${(y(v)+3.5).toFixed(1)}" class="ya">${fmtAxis(v)}</text>`; return g; }
function barChart(pts, tipFn){
  const iw=CW-CL-CR, ih=CH-CT-CB;
  const mx=Math.max(0,...pts.map(p=>p.v)), st=niceStep(mx||1,4), top=Math.ceil((mx||1)/st)*st;
  const y=v=>CT+ih-(v/top)*ih, n=pts.length, bw=iw/n, every=Math.ceil(n/6);
  let bars="", xl="";
  pts.forEach((p,i)=>{ const x=CL+i*bw;
    bars+=`<g data-tip="${esc(tipFn(p))}"><rect x="${x.toFixed(1)}" y="${CT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent"/>${p.v>0?`<rect class="col hl" x="${(x+bw*.15).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${Math.max(1,ih*p.v/top).toFixed(1)}" rx="${Math.min(3,bw*.2).toFixed(1)}"/>`:""}</g>`;
    if(i%every===0) xl+=`<text x="${(x+bw/2).toFixed(1)}" y="${CH-6}" class="xa">${esc(p.label)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img">${gridY(0,top,st,y)}${bars}${xl}</svg>`;
}
// days: [{ts, a, b, tip}] two series drawn as lines (a = top weight, b = est. 1RM)
function lineChart(r, days){
  const iw=CW-CL-CR, ih=CH-CT-CB;
  const all=days.flatMap(d=>[d.a,d.b]); let mn=Math.min(...all), mx=Math.max(...all);
  const st=niceStep((mx-mn)||mx||1,4); const lo=Math.max(0,Math.floor(mn/st)*st - (mx===mn?st:0)), hi=Math.ceil(mx/st)*st + (mx===mn?st:0);
  const y=v=>CT+ih-((v-lo)/(hi-lo))*ih, x=ts=>CL+((ts-r.from)/Math.max(1,r.to-r.from))*iw;
  const path=k=>days.map((d,i)=>(i?"L":"M")+x(d.ts).toFixed(1)+" "+y(d[k]).toFixed(1)).join("");
  let xl=""; for(let i=0;i<4;i++){ const ts=r.from+(r.to-r.from)*(i+.5)/4; const d=new Date(ts); xl+=`<text x="${x(ts).toFixed(1)}" y="${CH-6}" class="xa">${d.getMonth()+1}/${d.getDate()}</text>`; }
  const dots=days.map(d=>`<g data-tip="${esc(d.tip)}"><circle cx="${x(d.ts).toFixed(1)}" cy="${y(d.a).toFixed(1)}" r="12" fill="transparent"/><circle class="dot hl b" cx="${x(d.ts).toFixed(1)}" cy="${y(d.b).toFixed(1)}" r="3.5"/><circle class="dot hl a" cx="${x(d.ts).toFixed(1)}" cy="${y(d.a).toFixed(1)}" r="3.5"/></g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img">${gridY(lo,hi,st,y)}<path class="ln b" d="${path("b")}"/><path class="ln a" d="${path("a")}"/>${dots}${xl}</svg>`;
}
const e1rm = s=> s.r>1? s.w*(1+s.r/30) : s.w;
function chartHTML(){
  const r=chartRange(); const used=new Set(S.sets.map(s=>s.sid));
  const visits=S.sessions.filter(x=>used.has(x.id));
  const per=[[30,"p30"],[90,"p90"],[365,"p365"],[0,"pAll"]];
  const mets={ex:"mEx",vol:"mVol",kcal:"mKcal",stay:"mStay",visits:"mVisits",parts:"mParts",cardio:"mCardio"};
  const unitTxt={day:t("perDay"),week:t("perWeek"),month:t("perMonth")}[r.unit];
  const inR=ts=>ts>=r.from&&ts<=r.to;
  let sel="", summary="", chart="", legend="", note="";
  const bars=(pts,fmtV,sumV)=>{ if(!pts.some(p=>p.v>0)) return false; chart=barChart(pts,p=>p.long+"　"+fmtV(p.v)); summary=sumV; note=unitTxt+" · "+t("tapHint"); return true; };
  const m=hist.metric;
  if(m==="ex"){
    const opts=sortedExercises(()=>true).filter(x=>x.n>0);
    if(!opts.some(x=>x.e.id===hist.ex)) hist.ex=(opts.find(x=>!isCardio(x.e))||opts[0]||{e:{}}).e.id||null;
    sel=opts.length?`<select id="hex" class="exsel">${opts.map(x=>`<option value="${esc(x.e.id)}" ${x.e.id===hist.ex?"selected":""}>${esc(exName(x.e))}</option>`).join("")}</select>`:"";
    const e=exById(hist.ex); const sets=S.sets.filter(s=>s.ex===hist.ex&&inR(s.t));
    if(e&&isCardio(e)){ const pts=perBucket(r,sets,s=>s.t,s=>(s.d||0)/60); bars(pts,v=>Math.round(v)+t("cMin"),t("sumTotal",{v:Math.round(pts.reduce((a,p)=>a+p.v,0))+t("cMin")})); }
    else if(sets.length){
      const byDay={}; for(const s of sets){ const k=startOfDay(s.t); const d=byDay[k]||(byDay[k]={ts:k+DAY/2,a:0,b:0}); d.a=Math.max(d.a,s.w); d.b=Math.max(d.b,e1rm(s)); }
      const days=Object.values(byDay).sort((p,q)=>p.ts-q.ts).map(d=>Object.assign(d,{a:Math.round(d.a*10)/10,b:Math.round(d.b*10)/10,tip:dayLabel(dayKey(d.ts))+"　"+t("maxW")+" "+fmtKg(Math.round(d.a*10)/10)+"kg · "+t("e1rm")+" "+fmtKg(Math.round(d.b*10)/10)+"kg"}));
      chart=lineChart(r,days);
      summary=t("sumBest",{w:fmtKg(Math.max(...days.map(d=>d.a))), r:fmtKg(Math.max(...days.map(d=>d.b)))});
      legend=`<div class="legend"><span><i style="background:var(--violet-hi)"></i>${t("maxW")}</span><span><i style="background:var(--pink)"></i>${t("e1rm")}</span></div>`;
      note=t("e1rmNote")+" "+t("tapHint");
    }
  } else if(m==="vol"){ const pts=perBucket(r,S.sets.filter(s=>!isCardio(exById(s.ex))),s=>s.t,s=>(s.w||0)*(s.r||0)); bars(pts,v=>Math.round(v).toLocaleString()+"kg",t("sumTotal",{v:Math.round(pts.reduce((a,p)=>a+p.v,0)).toLocaleString()+"kg"})); }
  else if(m==="kcal"){ const pts=perBucket(r,visits,x=>x.start,x=>sessionKcal(x)); const n=visits.filter(x=>inR(x.start)).length, tot=pts.reduce((a,p)=>a+p.v,0);
    if(bars(pts,v=>kcalTxt(v),t("sumTotal",{v:kcalTxt(tot)})+" · "+t("sumAvg",{v:kcalTxt(tot/Math.max(1,n))}))) note=t("bwNote")+(S.settings.bw?"":" "+t("bwUnset"))+"<br>"+note; }
  else if(m==="stay"){ const pts=perBucket(r,visits,x=>x.start,x=>(x.end-x.start)); const n=visits.filter(x=>inR(x.start)).length, tot=pts.reduce((a,p)=>a+p.v,0);
    pts.forEach(p=>p.v/=60000); bars(pts,v=>fmtHM(v*60000),t("sumTotal",{v:fmtHM(tot)})+" · "+t("sumAvg",{v:fmtHM(tot/Math.max(1,n))})); }
  else if(m==="visits"){ const pts=perBucket(r,visits,x=>x.start,()=>1); const n=pts.reduce((a,p)=>a+p.v,0); bars(pts,v=>t("visitsN",{n:v}),t("sumVisits",{n, w:(n/Math.max(1,(r.to-r.from)/DAY/7)).toFixed(1)})); }
  else if(m==="cardio"){ const pts=perBucket(r,S.sets.filter(s=>isCardio(exById(s.ex))),s=>s.t,s=>(s.d||0)/60); bars(pts,v=>Math.round(v)+t("cMin"),t("sumTotal",{v:Math.round(pts.reduce((a,p)=>a+p.v,0))+t("cMin")})); }
  else if(m==="parts"){
    const c={}; for(const s of S.sets){ const e=exById(s.ex); if(!e||isCardio(e)||!inR(s.t)) continue; c[e.part]=(c[e.part]||0)+1; }
    const rows=Object.entries(c).sort((a,b)=>b[1]-a[1]); const mx=rows.length?rows[0][1]:1;
    if(rows.length){ chart=rows.map(([p,n])=>`<div class="hb"><span>${esc(partName(p))}</span><div class="hbt"><i style="width:${(n/mx*100).toFixed(1)}%"></i></div><b>${n}</b></div>`).join("");
      summary=t("sumTotal",{v:t("setsN",{n:rows.reduce((a,x)=>a+x[1],0)})}); }
  }
  return `<div class="chips" style="margin-top:12px">${per.map(([d,k])=>`<button class="chip ${hist.period===d?"on":""}" data-period="${d}">${t(k)}</button>`).join("")}</div>
    <div class="chips" style="margin-top:8px">${Object.entries(mets).map(([k,l])=>`<button class="chip ${m===k?"on":""}" data-metric="${k}">${t(l)}</button>`).join("")}</div>
    <div class="card" style="margin-top:12px">${sel}
      ${chart?`<div class="tip" id="tip" data-sum="${esc(summary)}">${esc(summary)}</div>${chart}${legend}<p class="note">${note}</p>`:`<div class="empty">${t("noData")}</div>`}
    </div>`;
}

      <p class="note">${t("backupNote")}</p>
      <textarea id="imp" placeholder="${esc(t("pastePh"))}"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" data-act="import">${t("load")}</button></div>
    </div></div>
    <p class="note">${t("homeNote")}</p><p class="note" style="opacity:.6">ver 20261018-1555</p>`;
}

// ---------- tick ----------
function tick(){
  const tm=T(); const now=Date.now();
  const el = id=>document.getElementById(id);
  if(autoClose(now)){ save({}); if(view.name==="list"||view.name==="history") return render(); }
  const vc=el("visitClock"); const ox=openSession(); if(vc&&ox) vc.textContent = fmtLong(((tm.phase==="idle"?ox.end:now) - ox.start)/1000);
  const vk=el("visitKcal"); if(vk&&ox) vk.textContent = kcalTxt(sessionKcal(ox, tm.phase==="idle"?ox.end:now));
  const onMine = view.name==="ex" && tm.exId===view.ex;
  if(tm.phase==="rest"){
    const sec=(now-tm.start)/1000, target=S.settings.rest;
    if(!tm.beeped && sec>=target){ tm.beeped=true; beep(3); save({sync:false}); }
    if(sec>15*60){ endRest(); return; }
    const rs=el("sheetRest"); if(rs) rs.textContent=t("restNow",{t:fmt(sec)});
  }
  if(onMine){
    const c=el("clock"); if(c) c.textContent = tm.phase==="idle"?"0:00":fmt((now-tm.start)/1000);
    if(tm.phase==="rest"){
      const sec=(now-tm.start)/1000, target=S.settings.rest, left=target-sec;
      const bar=el("restbar"); if(bar) bar.style.width = Math.min(100,sec/target*100)+"%";
      const info=el("restinfo"); if(info) info.textContent = left>0? t("goalLeft",{t:fmt(target),l:fmt(Math.ceil(left))}) : t("goalOver",{t:fmt(target),l:fmt(-left)});
      const tmEl=el("timer"); if(tmEl) tmEl.classList.toggle("over", left<=0);
    }
  }
  document.body.classList.toggle("ph-work", tm.phase==="work");
  document.body.classList.toggle("ph-rest", tm.phase==="rest");
  const pill=document.getElementById("pill");
  if(tm.phase!=="idle" && !onMine){
    const e=exById(tm.exId); pill.hidden=false; pill.className="pill"+(tm.phase==="work"?" work":"");
    const sec=(now-tm.start)/1000;
    const label = tm.phase==="work"? t("working") : t("resting");
    pill.innerHTML = `<span>${esc(exName(e))} · ${label}</span><span class="num">${fmt(sec)}</span>`;
    pill.dataset.ex = tm.exId;
  } else pill.hidden=true;
}
setInterval(tick, 250);

// ---------- sheets ----------
const sheet = document.getElementById("sheet");
let sheetOnClose = null;
function closeSheet(){ const f=sheetOnClose; sheetOnClose=null; sheet.innerHTML=""; if(f) f(); }

// Reps entry right after Stop. Closing the sheet keeps the suggested number.
function askRepsFor(id, thenFinished){
  const s=S.sets.find(x=>x.id===id); if(!s) return;
  let r = s.r;
  const draw = ()=>{
    sheet.querySelector("#rv").value = r;
    sheet.querySelectorAll(".repgrid button").forEach(b=>b.classList.toggle("on", +b.dataset.rp===r));
  };
  const commit = ()=>{
    const typed=parseInt(sheet.querySelector("#rv")?.value,10); if(!isNaN(typed)&&typed>=0) r=typed;
    s.r=r; touchSet(s); setVals(s.ex,{r}); save({}); render();
    toast(thenFinished ? t("finished",{name:exName(exById(s.ex)), n:S.sets.filter(x=>x.ex===s.ex && dayKey(x.t)===todayKey()).length})
                       : t("recorded",{w:fmtKg(s.w), r:s.r}), thenFinished?null:()=>editSet(s.id));
  };
  sheetOnClose = commit;
  sheet.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(t("repsQ"))}">
    <div class="row"><h3>${t("repsQ")}</h3><span class="spacer"></span><span class="resttick" id="sheetRest"></span></div>
    <div class="sub">${esc(exName(exById(s.ex)))} · ${fmtKg(s.w)}kg</div>
    <div class="stepper"><button data-rs="-1" aria-label="−">−</button><input id="rv" inputmode="numeric" value="${r}"><button data-rs="1" aria-label="+">＋</button></div>
    <div class="repgrid">${[3,5,6,8,10,12].map(n=>`<button data-rp="${n}">${n}</button>`).join("")}</div>
    <button class="bigsave" data-act="close">${t("save")}</button>
  </div></div>`;
  sheet.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{ r=Math.max(0,(parseInt(sheet.querySelector("#rv").value,10)||0)+(+b.dataset.rs)); draw(); });
  sheet.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>{ r=+b.dataset.rp; draw(); });
  sheet.querySelector("#rv").addEventListener("focus", ev=>setTimeout(()=>ev.target.select(),0));
  draw(); tick();
}
function editSet(id){
  const s=S.sets.find(x=>x.id===id); if(!s) return;
  let confirm=false;
  sheet.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(t("editTitle",{name:exName(exById(s.ex))}))}">
    <h3>${esc(t("editTitle",{name:exName(exById(s.ex))}))}</h3>
    <div class="two">
      <label class="field">${t("weightKg")}<input id="ew" inputmode="decimal" value="${fmtKg(s.w)}"></label>
      <label class="field">${t("reps")}<input id="er" inputmode="numeric" value="${s.r}"></label>
    </div>
    <div class="acts"><button class="btn danger" id="edel">${t("del")}</button><button class="btn" data-act="close">${t("close")}</button><button class="btn primary" id="esave">${t("save")}</button></div>
  </div></div>`;
  sheet.querySelector("#esave").onclick=()=>{
    const w=parseFloat(sheet.querySelector("#ew").value), r=parseInt(sheet.querySelector("#er").value,10);
    if(!isNaN(w)&&w>=0) s.w=w; if(!isNaN(r)&&r>=0) s.r=r; touchSet(s);
    if(S.timer.setId===s.id) setVals(s.ex,{w:s.w,r:s.r});
    save({}); closeSheet(); render();
  };
  sheet.querySelector("#edel").onclick=(ev)=>{
    if(!confirm){ confirm=true; ev.target.textContent=t("reallyDel"); return; }
    dirtyMonths.add(monthKey(s.t)); S.sets=S.sets.filter(x=>x.id!==s.id); S.deleted.push(s.id); if(S.deleted.length>2000) S.deleted=S.deleted.slice(-2000);
    if(S.timer.setId===s.id) S.timer={phase:"idle"};
    save({}); closeSheet(); render();
  };
}
function addExercise(){
  let type = nav.cat && nav.cat!=="freq" ? nav.cat : "machine";
  sheet.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(t("addTitle"))}">
    <h3>${t("addTitle")}</h3>
    <label class="field">${t("exName")}<input id="nn" placeholder="${esc(t("exPh"))}"></label>
    <div class="seg" id="nt">${["machine","free","cardio"].map(k=>`<button data-t="${k}" class="${type===k?"on":""}">${t(k)}</button>`).join("")}</div>
    <label class="field" id="npw" ${type==="cardio"?"hidden":""}>${t("part")}<select id="np">${PARTS.filter(p=>p!=="有酸素").map(p=>`<option value="${p}" ${nav.part===p?"selected":""}>${esc(partName(p))}</option>`).join("")}</select></label>
    <div class="acts"><button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" id="nsave">${t("add")}</button></div>
  </div></div>`;
  sheet.querySelectorAll("#nt button").forEach(b=>b.onclick=()=>{ type=b.dataset.t; sheet.querySelector("#npw").hidden = type==="cardio"; sheet.querySelectorAll("#nt button").forEach(x=>x.classList.toggle("on",x===b)); });
  sheet.querySelector("#nsave").onclick=()=>{
    const name=sheet.querySelector("#nn").value.trim(); if(!name){ sheet.querySelector("#nn").focus(); return; }
    S.exercises.push({id:"c"+uid(), name, type, part:type==="cardio"?"有酸素":sheet.querySelector("#np").value, custom:true, o:1000+S.exercises.length, u:Date.now()});
    save({}); closeSheet(); render(); toast(t("added",{name}));
  };
  setTimeout(()=>sheet.querySelector("#nn")?.focus(),50);
}
let toastTimer=null;
function toast(msg, onTap){
  const el=document.getElementById("toast"); el.textContent=msg; el.hidden=false; el.onclick=()=>{ el.hidden=true; onTap&&onTap(); };
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.hidden=true, 3500);
}

// ---------- entry screen ----------
const entry = document.getElementById("entry");
function drawEntry(){
  const first=!S.settings.lang;
  document.getElementById("pickLang").hidden=!first;
  document.getElementById("entryMain").style.display=first?"none":"flex";

let viewerName = "";
let seen=false; try{ seen = sessionStorage.getItem("gymlog.entered")==="1"; }catch(e){}
entry.hidden = seen;
["langs","pickLang"].forEach(id=>document.getElementById(id).addEventListener("click", ev=>{ const b=ev.target.closest("button"); if(!b||!b.dataset.lang) return; S.settings.lang=b.dataset.lang; save({}); drawEntry(); render(); }));

// ---------- events ----------
document.getElementById("tabs").addEventListener("click", ev=>{
  const b=ev.target.closest("button"); if(!b) return; view={name:b.dataset.tab, filter:view.filter||"all"}; window.scrollTo(0,0); render();
});
document.getElementById("pill").addEventListener("click", ()=>{ const id=document.getElementById("pill").dataset.ex; if(id){ view={name:"ex",ex:id,filter:view.filter}; window.scrollTo(0,0); render(); } });
sheet.addEventListener("click", ev=>{ if(ev.target.dataset.act==="close") closeSheet(); });

app.addEventListener("click", ev=>{
  const tipG = ev.target.closest("[data-tip]");
  if(tipG){ const tip=document.getElementById("tip"); if(tip) tip.textContent=tipG.dataset.tip; app.querySelectorAll(".hl.on").forEach(x=>x.classList.remove("on")); tipG.querySelectorAll(".hl").forEach(x=>x.classList.add("on")); return; }
  const b = ev.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.hmode){ hist.mode=d.hmode; render(); return; }
  if(d.period!=null){ hist.period=+d.period; render(); return; }
  if(d.metric){ hist.metric=d.metric; render(); return; }
  if(d.cat){ nav.cat=d.cat; nav.part=null; render(); return; }
  if(d.part){ nav.part=d.part; window.scrollTo(0,0); render(); return; }
  if(d.ex){ view={name:"ex",ex:d.ex,filter:view.filter}; window.scrollTo(0,0); render(); return; }
  if(d.set){ editSet(d.set); return; }
  if(d.setlang){ S.settings.lang=d.setlang; save({}); drawEntry(); render(); return; }
  if(d.rest){ S.settings.rest=+d.rest; if(S.timer.phase==="rest") S.timer.beeped=((Date.now()-S.timer.start)/1000)>=S.settings.rest; save({}); render(); return; }
  if(d.w){ const v=vals(view.ex); const st=v.step; const w=Math.max(0, Math.round((v.w + st*(+d.w))/st)*st); setVals(view.ex,{w:Math.round(w*100)/100}); document.getElementById("w").value=fmtKg(vals(view.ex).w); return; }
  if(d.delgym){ if(view.confirmGym!==d.delgym){ view.confirmGym=d.delgym; render(); return; } S.gyms=S.gyms.filter(g=>g.id!==d.delgym); if(S.currentGym===d.delgym) S.currentGym=null; view.confirmGym=null; save({}); render(); return; }
  if(d.cal){ const x=S.sessions.find(y=>y.id===d.cal); if(x) addToCalendar(x); return; }
  if(d.hide){ const e=exById(d.hide); e.hidden=!e.hidden; e.u=Date.now(); save({}); render(); return; }
  if(d.del){ if(view.confirmDel!==d.del){ view.confirmDel=d.del; render(); return; } S.exercises=S.exercises.filter(x=>x.id!==d.del); deletedEx.add(d.del); S.deletedEx=[...deletedEx]; view.confirmDel=null; save({}); render(); return; }
  switch(d.act){
    case "back": view={name:"list"}; render(); break;
    case "parts": nav.part=null; render(); break;
    case "start": startSet(view.ex); break;
    case "stop": stopSet(); break;
    case "quick": quickLog(view.ex); break;
    case "cancel": S.timer={phase:"idle"}; save({}); render(); break;
    case "finish": finishExercise(); break;
    case "endgym": endGym(); break;
    case "gym": askGym(); break;
    case "autocal": S.settings.autoCal=!S.settings.autoCal; save({}); render(); break;
    case "step": { const v=vals(view.ex); const steps=[1,1.25,2.5,5]; const i=steps.indexOf(v.step); setVals(view.ex,{step:steps[(i+1)%steps.length]}); renderEx(); tick(); break; }
    case "add": addExercise(); break;
    case "more": view.limit=(view.limit||20)+20; render(); break;
    case "copy": {
      const txt=JSON.stringify({v:1,exercises:S.exercises,sets:S.sets,sessions:S.sessions,gyms:S.gyms,deleted:S.deleted,deletedEx:S.deletedEx||[],bw:S.settings.bw||null,bwU:S.settings.bwU||0});
      const ta=document.getElementById("imp");
      Promise.resolve().then(()=>navigator.clipboard.writeText(txt)).then(()=>toast(t("copied")),()=>{ ta.value=txt; ta.select(); toast(t("selected")); });
      break; }
    case "import": {
      try{ const p=JSON.parse(document.getElementById("imp").value); mergeIn(p); S.sets.forEach(s=>dirtyMonths.add(monthKey(s.t))); save({}); render(); toast(t("loaded")); }
      catch(e){ toast(t("loadFail")); }
      break; }
  }
});
app.addEventListener("change", ev=>{
  if(ev.target.id==="hex"){ hist.ex=ev.target.value; render(); return; }
  if(ev.target.id==="bw"){ const w=parseFloat(ev.target.value); if(!isNaN(w)&&w>=20&&w<=300){ S.settings.bw=Math.round(w*10)/10; S.settings.bwU=Date.now(); save({}); } render(); return; }
  if(ev.target.id==="w"){ const w=parseFloat(ev.target.value); if(!isNaN(w)&&w>=0) setVals(view.ex,{w}); ev.target.value=fmtKg(vals(view.ex).w); }
});
app.addEventListener("focusin", ev=>{ if(ev.target.matches(".stepper input")) setTimeout(()=>ev.target.select(),0); });

// ---------- merge & cloud sync ----------
const deletedEx = new Set(S.deletedEx||[]);
function mergeIn(p){
  if(!p) return;
  const del = new Set([...(S.deleted||[]), ...(p.deleted||[])]);
  (p.deletedEx||[]).forEach(id=>deletedEx.add(id)); S.deletedEx=[...deletedEx];
  const sets = new Map(S.sets.map(s=>[s.id,s]));
  for(const s of (p.sets||[])){ if(!s||!s.id) continue; const cur=sets.get(s.id); if(!cur || (s.u||0)>(cur.u||0)) sets.set(s.id, Object.assign({},s)); }
  S.sets = [...sets.values()].filter(s=>!del.has(s.id));
  S.deleted = [...del].slice(-2000);
  const exs = new Map(S.exercises.map(e=>[e.id,e]));
  for(const e of (p.exercises||[])){ if(!e||!e.id) continue; const cur=exs.get(e.id); if(!cur || (e.u||0)>(cur.u||0)) exs.set(e.id, Object.assign({},e)); }
  S.exercises = [...exs.values()].filter(e=>!deletedEx.has(e.id));
  const ses = new Map(S.sessions.map(x=>[x.id,x]));
  for(const x of (p.sessions||[])){ if(!x||!x.id) continue; const cur=ses.get(x.id); if(!cur || (x.u||0)>(cur.u||0)) ses.set(x.id, Object.assign({},x)); }
  S.sessions = [...ses.values()];
  const gm = new Map((S.gyms||[]).map(g=>[g.id,g]));
  for(const g of (p.gyms||[])){ if(g&&g.id&&!gm.has(g.id)) gm.set(g.id, Object.assign({},g)); }
  S.gyms=[...gm.values()];
  if(!S.settings.lang && p.lang) S.settings.lang=p.lang;
  if(p.bw && (p.bwU||0)>(S.settings.bwU||0)){ S.settings.bw=p.bw; S.settings.bwU=p.bwU||0; }
  if(p.last) for(const k in p.last) if(!S.last[k]) S.last[k]=p.last[k];
}

const sync = {on:false, err:false, col:null, timer:null, busy:false};
function scheduleSync(){ if(!sync.on) return; clearTimeout(sync.timer); sync.timer=setTimeout(push, 1500); }
async function push(){
  if(!sync.on) return;
  if(sync.busy){ scheduleSync(); return; }
  sync.busy=true;
  try{
    const months=[...dirtyMonths]; dirtyMonths.clear();
    for(const m of months){ await sync.col.doc("m-"+m).set({sets: S.sets.filter(s=>monthKey(s.t)===m)}); }
    if(metaDirty || months.length){ metaDirty=false;
      await sync.col.doc("meta").set({exercises:S.exercises, sessions:S.sessions, gyms:S.gyms, lang:S.settings.lang||null, bw:S.settings.bw||null, bwU:S.settings.bwU||0, deleted:S.deleted, deletedEx:S.deletedEx||[], last:S.last, u:Date.now()}); }
    sync.err=false;
  }catch(e){ sync.err=true; metaDirty=true; setTimeout(scheduleSync, 15000); }
  sync.busy=false;
}
(async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(user){ try{ const me=await user.me(); viewerName=(me&&me.name)||""; drawEntry(); }catch(e){} }
    if(!db || !user) return;
    const me = await user.id(); if(!me) return;
    sync.col = db.collection("data/users/"+me);
    const snap = await sync.col.get();
    const remote = {sets:[], sessions:[], exercises:[], deleted:[], deletedEx:[], last:null};
    for(const doc of snap.docs){ const d=doc.data()||{};
      if(doc.id==="meta"){ remote.exercises=d.exercises||[]; remote.sessions=d.sessions||[]; remote.gyms=d.gyms||[]; remote.lang=d.lang||null; remote.bw=d.bw||null; remote.bwU=d.bwU||0; remote.deleted=d.deleted||[]; remote.deletedEx=d.deletedEx||[]; remote.last=d.last||null; }
      else if(doc.id.startsWith("m-")) remote.sets.push(...(d.sets||[])); }
    const remoteIds = new Set(remote.sets.map(s=>s.id));
    mergeIn(remote);
    sync.on = true; drawEntry();
    for(const s of S.sets) if(!remoteIds.has(s.id)) dirtyMonths.add(monthKey(s.t));
    metaDirty = true;
    save({sync:false}); scheduleSync(); render();
  }catch(e){ sync.on=false; }
})();

// ---------- Google Calendar ----------
const calFail = {};
function isoLocal(ts){ const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }
function utcStamp(ts){ return new Date(ts).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function calText(x){
  const lines = groupByEx(sessionSets(x)).map(g=>exName(exById(g.ex))+": " + (isCardio(exById(g.ex))? setsTxt(g.sets) : g.sets.map(s=>fmtKg(s.w)+"kg×"+s.r).join(", ")+" ("+t("setsN",{n:g.sets.length})+")"));
  return t("calStay",{d:fmtHM(x.end-x.start), n:sessionSets(x).length})+" · "+kcalTxt(sessionKcal(x))+"\n"+lines.join("\n");
}
function calEnd(x){ return Math.max(x.end, x.start+5*60000); }
function calLink(x){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(t("calSummary"))+"&dates="+utcStamp(x.start)+"/"+utcStamp(calEnd(x))+"&details="+encodeURIComponent(calText(x))+(gymName(x)?"&location="+encodeURIComponent(gymName(x)):"");
}
let mcpP=null;
async function addToCalendar(x){
  if(!window.claude){ window.open(calLink(x), "_blank"); x.cal=true; x.u=Date.now(); save({}); if(view.name==="history") render(); return; }
  const fail = msg=>{ calFail[x.id]=msg; if(view.name==="history") render(); toast(msg+t("calManual")); };
  try{
    if(!window.claude || !window.claude.use) return fail(t("calNoEnv"));
    mcpP = mcpP || window.claude.use("mcp");
    const mcp = await mcpP; if(!mcp) return fail(t("calNoCap"));
    const res = await mcp.callTool("Google Calendar","create_event",Object.assign({summary:t("calSummary"), startTime:isoLocal(x.start), endTime:isoLocal(calEnd(x)), description:calText(x)}, gymName(x)?{location:gymName(x)}:{}));
    const p = res && res.payload; x.cal = (p && (p.id || (p.event&&p.event.id))) || true; x.u=Date.now(); delete calFail[x.id];
    save({}); render(); toast(t("calOk"));
  }catch(e){
    const code = e && e.code;
    fail(code==="server_not_connected"||code==="server_not_found" ? t("calNotConn")
      : code==="needs_reauth" ? t("calReauth")
      : code==="not_granted"||code==="consent_required" ? t("calDenied") : t("calErr"));
  }
}

drawEntry();
render();
})();
