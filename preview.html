<title>ジムとサウナ</title>

<style>
/* Layout: one-column phone app, committed to a single dark look: black iron with violet light. Start = violet, Stop = hot pink, rest = deep violet glow. */
:root{
  color-scheme:dark;
  --bg:#08070b; --surface:#141119; --surface2:#1f1a28; --line:#2d2639; --ink:#f2eff8; --muted:#9b92ab;
  --violet:#8b5cf6; --violet-hi:#b69cff; --violet-deep:#2a1752; --violet-ink:#ffffff;
  --pink:#ec4f86; --pink-ink:#ffffff; --ok:#6fd6a0;
  --glow:0 0 0 1px rgba(139,92,246,.35),0 8px 30px rgba(139,92,246,.25);
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;overflow-x:hidden;max-width:100%}
#app,#sheet,.coach{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--violet-hi);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.02em;margin:4px 0 2px;text-wrap:balance;line-height:1.15}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}

/* entry screen */
.entry{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.entry svg.hero{position:absolute;inset:0;width:100%;height:100%}
.entry .content{position:relative;height:100%;justify-content:flex-end;padding:env(safe-area-inset-top,0px) max(24px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:560px;width:100%;align-self:center;box-sizing:border-box}
.entry .brand{font-family:var(--display);font-size:64px;line-height:.9;letter-spacing:.02em;margin:0}
.entry .brandbox{opacity:0;transition:opacity .35s ease;}
body.heroready .entry .brandbox{opacity:1}
.entry .brandbox{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px}
.entry .brand{font-size:clamp(50px,16.5vw,96px);position:relative;z-index:1;white-space:nowrap;display:flex;align-items:flex-start;gap:.6em}

.entry .brand .bm{color:#c9b6ff;text-shadow:0 0 24px rgba(139,92,246,.8)}
.entry .brand .bs{color:#ff8fb4;text-shadow:0 0 24px rgba(214,51,108,.8)}
.entry .brand .ba{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.55)}
.entry .brand{font-family:"Dela Gothic One","Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-weight:900;letter-spacing:0;line-height:1}
.entry .ben{position:relative;z-index:1;white-space:nowrap;font-family:var(--display);font-size:clamp(20px,6.6vw,30px);letter-spacing:.14em;text-shadow:0 1px 8px #000}
.entry .ben .ea{color:#c9b6ff}.entry .ben .eb{color:#ff8fb4}.entry .ben .em{color:#fff;margin:0 .5em}
.ob .obq{display:flex;align-items:center;gap:10px;align-self:stretch}
.ob .obq>span{flex:1;min-width:0;font-size:14px;font-weight:700;color:#e9e3f5;white-space:nowrap;text-shadow:0 1px 6px #000}
.ob .obq .seg{flex:none;align-self:auto}
.ob .obq .seg button{padding:9px 10px;white-space:nowrap;font-size:13px}
@media (max-width:360px){.ob .obq .seg button{padding:7px 7px;font-size:12px}.ob .obq>span{font-size:13px}}
.ob .obhl{display:block;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--violet);color:#c9b6ff;font-size:13px;font-weight:700;text-decoration:none;background:rgba(20,17,25,.85)}
.entry .bsub .ta{color:#c9b6ff}
.entry .bsub .tm{color:#fff;margin:0 .35em}
.entry .bsub .tb{color:#ff8fb4}
.entry .bsub .tc{color:#fff;white-space:pre}
.entry .bsub{margin-top:0;font-size:16px;position:relative;z-index:1;text-shadow:0 1px 6px #000;white-space:nowrap;font-size:13px;font-weight:700;letter-spacing:.25em;color:#cfc6e2}
.entry .bsub i{font-style:normal;opacity:.6}
.entry .lede{color:#cfc6e2;font-size:15px;margin:0}
.entry .who{font-size:13px;color:var(--muted)}
.entry .go{height:48px;font-size:16px!important;border-radius:16px;background:var(--violet);color:var(--violet-ink);font-size:18px;font-weight:800;letter-spacing:.06em;box-shadow:var(--glow)}
.entry .go:active{transform:scale(.985)}
.ob{display:flex;flex-direction:column;gap:6px}
.ob .seg button{padding:9px 6px;font-size:13px}
.ob input{height:40px;border-radius:10px;background:rgba(20,17,25,.85);border:1px solid var(--line);padding:0 12px;font-size:15px;font-weight:600;color:var(--ink);box-sizing:border-box;width:100%;min-width:0}
.ob input:focus{border-color:var(--violet)}
.ob .bwrow{position:relative}
.ob .bwrow span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-family:var(--num);font-size:15px}
.ob .seg{background:rgba(20,17,25,.85);border:1px solid var(--line);align-self:flex-start}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes .go{display:flex;align-items:center;justify-content:center;gap:8px}
.modes .go svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.modes .go.sauna{background:linear-gradient(160deg,#e0457e,#8e1d52);box-shadow:0 8px 30px rgba(214,51,108,.35)}
.rounds{margin-top:12px}
.rounds .rh,.rounds .rr{display:grid;grid-template-columns:3.6em minmax(0,1fr) minmax(0,1fr) 24px;gap:6px;align-items:center}
.rounds .rh{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.rounds .rr{padding:6px 0;border-top:1px solid var(--line)}
.rounds .rr:first-of-type{border-top:0}
.rounds .rr b{font-size:13px}
.sc2{display:flex;align-items:center;gap:2px;min-width:0}
.sc2 button{width:30px;height:38px;border-radius:9px;background:var(--surface2);font-size:18px;font-weight:600;flex:none}
.sc2 input{flex:1;min-width:0;width:100%;text-align:center;border:0;background:transparent;font-family:var(--num);font-weight:700;font-size:26px;padding:0}
.sc2 span:empty{display:none}
.sc2 span{font-size:11px;color:var(--muted);margin-right:2px}
@media (max-width:360px){.rounds .rh,.rounds .rr{grid-template-columns:3em minmax(0,1fr) minmax(0,1fr) 22px;gap:4px}.sc2 button{width:26px}.sc2 input{font-size:20px}}
.rx{color:var(--muted);font-size:18px;width:24px;height:38px}
.sform .pick{margin-top:0}
.sbig{width:100%;height:64px;border-radius:16px;background:linear-gradient(160deg,#e0457e,#8e1d52);color:#fff;font-size:20px;font-weight:800;letter-spacing:.06em;margin-top:12px}
.srow{display:flex;align-items:baseline;gap:10px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.srow b{font-family:var(--num);font-size:22px}
.srow .sub{flex:1;min-width:0}
.ob .two2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.ob #obSex{align-self:stretch}
.birth{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
.birth select{height:40px;font-size:15px!important;border-radius:10px;background:rgba(20,17,25,.85);border:1px solid var(--line);padding:0 10px;font-size:16px;font-weight:600;color:var(--ink);min-width:0;width:100%}
.card .birth select{background:var(--bg)}
.entry .hello{font-size:17px;font-weight:700;color:#e4dcf5}
.gymrow{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;background:var(--surface2);width:100%;text-align:left;font-weight:650;font-size:16px}
.gymrow small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}
.gymlist{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto}
.maplink{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--violet);color:var(--violet-hi);font-weight:700;text-decoration:none}
.langs{display:flex;gap:6px;background:rgba(20,17,25,.8);border:1px solid var(--line);border-radius:12px;padding:3px;align-self:flex-start;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.langs button{padding:7px 14px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.langs button.on{background:var(--violet-deep);color:var(--ink)}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--violet);color:var(--violet-ink)}

/* exercise list */
.list{display:flex;flex-direction:column;margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ex{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ex:last-child{border-bottom:0}
.ex:active{background:var(--surface2)}
.ex .name{font-weight:650;font-size:16px}
.ex .meta{color:var(--muted);font-size:12px;margin-top:2px}
.ex .info{flex:1;min-width:0}
.tag{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.tag.machine{background:var(--muted)}
.tag.free{background:var(--violet-hi)}
.today{font-size:12px;font-weight:700;color:var(--violet-hi);white-space:nowrap}
.rank{font-family:var(--num);font-size:18px;color:var(--muted);width:20px;text-align:center}
.toast.pr{white-space:nowrap;background:linear-gradient(135deg,#f5b301,#ff7a00);border-color:#ffd56b;color:#1a1000;font-size:16px;padding:12px 18px;animation:prpop .5s ease-out}
@keyframes prpop{0%{transform:translateX(-50%) scale(.6);opacity:0}60%{transform:translateX(-50%) scale(1.08);opacity:1}100%{transform:translateX(-50%) scale(1)}}
body.flash::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:70;background:#fff;animation:flash 1.2s ease-out forwards}
@keyframes flash{0%,40%{opacity:.35}20%,60%{opacity:0}50%{opacity:.35}100%{opacity:0}}
.goal{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.goal .gl1{flex:1;min-width:0;font-weight:700;font-size:14px}
.goal .gb{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.goal .gb i{display:block;height:100%;background:var(--violet-hi);border-radius:3px}
.goal.met .gb i{background:#f5b301}
.goal .st{font-size:12px;font-weight:700;color:#f5b301;white-space:nowrap}
.menus{display:flex;flex-wrap:wrap;gap:8px}
.menus button{padding:10px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:14px;text-align:left}
.menus button span{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.nudge{display:block;width:100%;margin-top:10px;padding:9px 12px;border-radius:10px;border:1px solid #f5b301;color:#ffd56b;background:rgba(245,179,1,.08);font-size:13px;font-weight:600;text-align:left}
.addbtn{margin-top:12px;width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--line);color:var(--muted);font-weight:600}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.cat{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:18px;min-height:132px;padding:14px;border-radius:18px;text-align:left;min-width:0;
  background:radial-gradient(120% 90% at 100% 0%,var(--c2) 0%,transparent 60%),linear-gradient(160deg,#1a1524,#100d16);border:1px solid var(--line)}
.cat:active{transform:scale(.98);border-color:var(--c1)}
.cat .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid var(--c1);box-shadow:0 0 18px var(--c2)}
.cat .ic svg{width:26px;height:26px;fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat .cn{font-family:var(--display);font-size:clamp(15px,4.6vw,20px);letter-spacing:.02em;line-height:1.15;white-space:nowrap}
.cat>span:nth-child(2){max-width:100%;min-width:0}
@media (max-width:360px){.cat{padding:12px 10px}.cat .cn{letter-spacing:0}}
.cat .cm{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
.cat .today{position:absolute;top:14px;right:14px}
.k-free{--c1:#b69cff;--c2:rgba(139,92,246,.35)}
.k-machine{--c1:#8fb3ff;--c2:rgba(80,120,255,.3)}
.k-cardio{--c1:#ff7aa8;--c2:rgba(236,79,134,.3)}
.k-field{--c1:#6fe0b0;--c2:rgba(60,200,140,.28)}
.k-fit{--c1:#ffc46b;--c2:rgba(255,170,60,.28)}
.cats.n3 .cat:nth-child(3){grid-column:1/-1;min-height:84px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.k-gym{--c1:#b69cff;--c2:rgba(139,92,246,.35)}
.k-home,.k-hbw,.k-hwt,.k-htm{--c1:#8fd3ff;--c2:rgba(80,180,255,.28)}
.tag.hbw,.tag.hwt,.tag.htm{display:inline-block;background:#8fd3ff}
.lessons{margin-top:12px;text-align:center}
.lessons .lbl{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.lessons .chips{justify-content:center}
.crumb{display:flex;align-items:center;gap:10px;margin-top:12px}
.crumb .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--c1)}
.crumb .ic svg{width:20px;height:20px;fill:none;stroke:var(--c1);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.crumb b{font-family:var(--display);font-weight:400;font-size:clamp(17px,5.4vw,22px);letter-spacing:.03em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb .back{white-space:nowrap;flex:none}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.partbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.partbtn:active{background:var(--surface2);border-color:var(--violet)}
.partbtn .pn{font-family:var(--display);font-size:24px;letter-spacing:.02em;line-height:1.1}
.partbtn .pm{font-size:12px;color:var(--muted)}
.tag.cardio{background:var(--pink)}
.tag.field{display:inline-block;background:#6fe0b0}
.tag.fit{display:inline-block;background:#ffc46b}
/* exercise screen */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.back{padding:8px 10px 8px 0;color:var(--violet-hi);font-weight:600;font-size:15px}
.prev{font-size:13px;color:var(--muted);margin:2px 0 10px;line-height:1.5}
.prev b{color:var(--ink);font-weight:600}
.timer{border-radius:18px;padding:14px 16px 16px;background:var(--surface);border:1px solid var(--line);text-align:center;transition:background .2s,box-shadow .2s}
.timer .phase{font-size:13px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.timer .clock{font-family:var(--num);font-weight:700;font-size:84px;line-height:1;font-variant-numeric:tabular-nums;margin:4px 0}
.timer.work{background:linear-gradient(160deg,#e5484d,#9b1c2c);border-color:transparent;color:#fff;box-shadow:0 8px 30px rgba(229,72,77,.35)}
.timer.work .phase{color:inherit;opacity:.85}
.timer.rest{background:linear-gradient(160deg,#2563eb,#1e3a8a);border-color:transparent;color:#fff;box-shadow:0 8px 30px rgba(37,99,235,.35)}
.timer.rest .phase,.timer.rest .restinfo{color:rgba(255,255,255,.85)}
.timer.rest .bar{background:rgba(255,255,255,.2)}
.timer.rest .bar i{background:#fff}
.timer.rest.over .clock{color:#ffd2dc}
.timer.rest .chip{background:rgba(255,255,255,.15);color:#fff}
.timer.rest .chip.on{background:#fff;color:#1e3a8a}
/* whole-screen tint while a set or a rest is running */
body{transition:background .3s}
body.ph-work{background:radial-gradient(140% 70% at 50% 0%,#5a0f1c 0%,#2a070e 45%,var(--bg) 100%) fixed var(--bg)}
body.ph-rest{background:radial-gradient(140% 70% at 50% 0%,#10306e 0%,#0a1634 45%,var(--bg) 100%) fixed var(--bg)}
body.ph-work::before{background:#5a0f1c}
body.ph-rest::before{background:#10306e}
body.ph-work .main.stop{background:#fff;color:#c4202f;box-shadow:0 8px 30px rgba(0,0,0,.35)}
body.ph-rest .main.start{background:#3b82f6;box-shadow:0 8px 30px rgba(59,130,246,.35)}
body.ph-work .pill.work{background:#c4202f;border-color:#ff8a92}
body.ph-rest .pill{background:#1d4ed8;border-color:#93b4ff}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--violet-hi));width:0}
.restinfo{font-size:13px;color:var(--muted)}
.timer.work .restinfo{color:rgba(255,255,255,.8)}
.rt{margin-top:10px;justify-content:center}
.rt .chip{padding:5px 10px}
.timer.work .rt{display:none}

.pick{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-top:12px;min-width:0}
.pick label{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.step{font-size:12px;font-weight:700;color:var(--violet-hi);padding:7px 10px;border-radius:8px;background:var(--surface2)}
.stepper{display:flex;align-items:center;gap:8px;margin-top:6px}
.stepper button{width:64px;height:60px;border-radius:14px;background:var(--surface2);font-size:30px;font-weight:600;flex:none}
.stepper button:active{background:var(--violet-deep)}
.stepper input{flex:1;min-width:0;width:100%;text-align:center;border:0;background:transparent;font-family:var(--num);font-weight:700;font-size:52px;font-variant-numeric:tabular-nums;padding:0}
.unit{font-family:var(--num);font-size:20px;color:var(--muted);margin-left:-6px}

.main{margin-top:12px;width:100%;height:76px;border-radius:18px;font-size:24px;font-weight:800;letter-spacing:.08em}
.main.start{background:var(--violet);color:var(--violet-ink);box-shadow:var(--glow)}
.main.stop{background:var(--pink);color:var(--pink-ink);box-shadow:0 8px 30px rgba(236,79,134,.3)}
.main:active{transform:scale(.985)}
.main:disabled{opacity:.4;box-shadow:none}
.subacts{display:flex;justify-content:space-between;margin-top:8px}
.link{color:var(--muted);font-size:13px;font-weight:600;padding:10px 6px;text-decoration:underline;text-underline-offset:3px}
.finish{margin-top:10px;width:100%;padding:14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:800;font-size:16px;display:flex;justify-content:center;gap:10px;align-items:baseline}
.finish span{font-size:13px;color:var(--muted);font-weight:600}

.sets{margin-top:16px}
.sets h2,.sec h2{font-size:12px;color:var(--muted);letter-spacing:.1em;margin:0 0 6px}
.set{display:flex;align-items:baseline;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;width:100%;text-align:left}
.set .n{font-family:var(--num);color:var(--muted);width:22px;font-size:17px}
.set .wr{font-family:var(--num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.set .wr small{font-size:15px;color:var(--muted);font-weight:600}
.set .t{margin-left:auto;font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
.empty{color:var(--muted);font-size:13px;padding:8px 2px}

/* visit banner */
.visit{margin-top:12px;display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#1d1430,#141119);border:1px solid #3b2a63;border-radius:14px;padding:10px 12px 10px 14px}
.visit>div{flex:1;min-width:0}
.vl{font-size:12px;font-weight:700;color:var(--violet-hi)}
.vt{font-size:30px;font-weight:700;line-height:1.1}

/* floating pill */
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--violet-deep);border:1px solid var(--violet);color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:700;display:flex;gap:10px;align-items:center;box-shadow:var(--glow);max-width:calc(100% - 32px)}
.pill.work{background:var(--violet);color:var(--violet-ink)}
.pill .num{font-size:22px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(10,9,14,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{flex:1;padding:10px 0 12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--violet-hi)}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on svg{filter:drop-shadow(0 0 6px rgba(139,92,246,.8))}

/* history & settings */
.sec{margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.day h3{font-size:15px;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.day h3 span{color:var(--muted);font-weight:500;font-size:13px}
.dl{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr);gap:4px 10px;font-size:14px}
.dl dt{font-weight:600;overflow-wrap:anywhere}
.dl dd{margin:0;color:var(--muted);font-family:var(--num);font-size:16px;overflow-wrap:anywhere}
.sc{font-family:var(--body);font-size:12px;color:var(--violet-hi)}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:0 0 8px}
.vrow b{color:var(--ink);font-size:16px}
.calok{font-size:12px;font-weight:700;color:var(--ok)}
.bwin{width:110px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:26px;font-weight:700;text-align:center}
.chart{width:100%;height:auto;display:block;margin-top:4px;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ya,.chart .xa{fill:var(--muted);font-size:10px;font-family:var(--num)}
.chart .ya{text-anchor:end}
.chart .xa{text-anchor:middle}
.chart .col{fill:var(--violet)}
.chart .col.on{fill:var(--violet-hi)}
.chart .ln{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.a{stroke:var(--violet-hi)}
.chart .ln.b{stroke:var(--pink);stroke-dasharray:5 4;opacity:.85}
.chart .dot.a{fill:var(--violet-hi)}
.chart .dot.b{fill:var(--pink)}
.chart .dot.on{stroke:#fff;stroke-width:2}
.tip{min-height:20px;font-size:14px;font-weight:700;margin-top:4px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px}
.hb{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.5em;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.hbt{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.hbt i{display:block;height:100%;background:var(--violet);border-radius:6px}
.hb b{font-family:var(--num);font-size:17px;text-align:right}
.exsel{box-sizing:border-box;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:16px;font-weight:600;margin-bottom:6px}
.mgr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.mgr:last-child{border-bottom:0}
.mgr .nm{flex:1;min-width:0}
.mgr .nm .sub{white-space:nowrap}
.goalseg button{padding:9px 2px;white-space:nowrap;font-size:13px}
.mgr .nm.off{color:var(--muted);text-decoration:line-through}
.sbtn{padding:9px 12px;border-radius:8px;background:var(--surface2);font-size:12px;font-weight:700}
.sbtn.on{background:var(--violet);color:var(--violet-ink)}
.sbtn.danger{color:var(--pink)}
.btn{padding:11px 14px;border-radius:10px;background:var(--surface2);font-weight:700}
.btn.primary{background:var(--violet);color:var(--violet-ink)}

function segKcal(ex, g, sec){
  let met=null; const kg=bodyKg();
  if(ex==="treadmill" && g.spd>0){ const v=g.spd*1000/60, gr=(g.inc||0)/100;
    met=(g.spd<8 ? 0.1*v+1.8*v*gr+3.5 : 0.2*v+0.9*v*gr+3.5)/3.5; }
  else if(ex==="bike" && g.watt>0) met=(10.8*g.watt/kg+7)/3.5;
  else if(ex==="stairs" && g.spm>0) met=(0.2*g.spm+1.33*1.8*0.2*g.spm+3.5)/3.5;
  else if(ex==="rowing" && g.watt>0) return (4*g.watt+300)*sec/3600;
  return kcalOf(met || MET_CARDIO[ex] || MET_CARDIO_OTHER, sec);
}
function setKcal(s){
  if(s.mk>0) return s.mk;
  const segs=segsOf(s); if(!segs.length) return kcalOf(MET_CARDIO[s.ex]||MET_CARDIO_OTHER, s.d||0);
  const secs=segSecs(s, segs); return segs.reduce((a,g,i)=>a+segKcal(s.ex, g, secs[i]), 0);
}
function machTxt(s){
  const f=segsOf(s).map(g=>(g.min>0?g.min+t("cMin")+" ":"")+(MACH[s.ex]||[]).filter(k=>g[k]!=null).map(k=>fmtKg(g[k])+machUnit(k)).join(" ")).filter(Boolean);
  const out=f.join(" → "); return s.mk>0 ? (out?out+" · ":"")+t("mkShort",{k:Math.round(s.mk)}) : out;
}
function machRowsHTML(ex, rows){
  const ks=MACH[ex]||[]; if(!ks.length) return "";
  const cols=ks.length+1, grid=`display:grid;grid-template-columns:repeat(${cols},minmax(0,1fr));gap:8px`;
  const head=`<div style="${grid};font-size:12px;font-weight:700;color:var(--muted)"><span>${t("segMin")}</span>${ks.map(k=>`<span>${t("m_"+k)}（${machUnit(k)}）</span>`).join("")}</div>`;
  const val=x=> x!=null&&x!=="" ? esc(String(x)) : "";
  return head + rows.map((r,i)=>`<div class="field mrow" data-i="${i}" style="${grid};margin-top:6px">
      <input data-k="min" inputmode="decimal" value="${val(r.min)}">${ks.map(k=>`<input data-k="${k}" inputmode="decimal" value="${val(r[k])}">`).join("")}</div>`).join("")
    + (rows.length<MACH_MAX_SEG ? `<button class="link" id="madd" style="margin-top:6px">${t("segAdd")}</button>` : "");
}
function machFields(s, last){
  let rows=segsOf(s).map(g=>Object.assign({},g));
  if(!rows.length){ const r={min:null}; for(const k of MACH[s.ex]||[]) if(last&&last[k]!=null) r[k]=last[k]; rows.push(r); }
  while(rows.length<2 && (MACH[s.ex]||[]).length) rows.push({min:null});
  return `<div id="mrows">${machRowsHTML(s.ex, rows)}</div>
    <label class="field" style="margin-top:10px">${t("mkLbl")}<input id="m_mk" inputmode="numeric" value="${s.mk>0?Math.round(s.mk):""}" placeholder="kcal"></label>
    <p class="note">${t("machNote")}</p>`;
}
const MACH_LIM={min:[0.5,600], spd:[0.5,30], inc:[-5,30], watt:[5,1500], spm:[5,250], mk:[1,3000]};
const machNum=(k,v)=>{ const n=parseFloat(String(v).replace(",",".")); return !isNaN(n)&&n>=MACH_LIM[k][0]&&n<=MACH_LIM[k][1] ? Math.round(n*10)/10 : null; };
function rawRows(){ return [...sheet.querySelectorAll(".mrow")].map(r=>{ const o={}; r.querySelectorAll("input").forEach(i=>o[i.dataset.k]=i.value); return o; }); }
function readMach(s){
  const ks=MACH[s.ex]||[], segs=[];
  for(const r of rawRows()){ const g={min:machNum("min",r.min)}; let any=false; for(const k of ks){ const n=machNum(k,r[k]); if(n!=null){ g[k]=n; any=true; } } if(any) segs.push(g); }
  for(const k of ks) delete s[k];
  if(segs.length){ s.segs=segs; const keep={}; for(const k of ks) if(segs[0][k]!=null) keep[k]=segs[0][k]; setVals(s.ex, keep); } else delete s.segs;
  const el=sheet.querySelector("#m_mk"); if(el){ const n=machNum("mk", el.value); if(n!=null) s.mk=n; else delete s.mk; }
  touchSet(s);
}
// wire the segment rows; live=true saves on every keystroke (sheet closed by tapping outside)
function bindMach(s, live){
  const box=sheet.querySelector("#mrows"); if(!box) return;
  const wire=()=>{
    if(live) sheet.querySelectorAll("input").forEach(i=>i.oninput=()=>readMach(s));
    const add=sheet.querySelector("#madd"); if(add) add.onclick=ev=>{ ev.stopPropagation(); const rows=rawRows(); rows.push({}); box.innerHTML=machRowsHTML(s.ex, rows); wire(); };
  };
  wire();
}

const setBw = w=>{ S.settings.bw=Math.round(w*10)/10; S.settings.bwU=Date.now(); };
function sessionKcal(x, until){
  const sets = sessionSets(x); let cardio=0, kc=0, strengthSets=0;
  for(const s of sets){ if(isCardio(exById(s.ex))){ cardio += s.d||0; kc += setKcal(s); } else strengthSets++; }
  const stay = ((until||x.end) - x.start)/1000;
  // sets logged without timing leave no stay time, so count at least 90 s per set
  return kc + kcalOf(MET_STRENGTH, Math.max(stay - cardio, strengthSets*90, 0));
}
function dayKcal(k){ return S.sessions.filter(x=>dayKey(x.start)===k).reduce((a,x)=>a+sessionKcal(x),0); }

// ---------- audio / wake lock ----------
let actx=null;
function unlockAudio(){ try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){} }
function beep(times){
  if(!actx) return;
  for(let i=0;i<times;i++){ const o=actx.createOscillator(), g=actx.createGain(); const tt=actx.currentTime+i*0.28;
    o.frequency.value=988; o.type="square"; g.gain.setValueAtTime(0.0001,tt); g.gain.exponentialRampToValueAtTime(0.5,tt+0.02); g.gain.exponentialRampToValueAtTime(0.0001,tt+0.2);
    o.connect(g).connect(actx.destination); o.start(tt); o.stop(tt+0.22); }
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
let wake=null;
async function keepAwake(){ try{ if("wakeLock" in navigator && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null;}); } }catch(e){} }

// ---------- timer logic ----------
const T = ()=> S.timer;
function closeRest(now, exId){
  const tm=T(); if(tm.phase!=="rest" || (exId && tm.exId!==exId)) return;
  const s = S.sets.find(x=>x.id===tm.setId);
  if(s){ s.rest = Math.round((now - tm.start)/1000); touchSet(s); }
}
function startSet(exId){
  unlockAudio(); const now=Date.now(); closeRest(now, exId); sessionFor(now); closeSheet();
  S.timer = {phase:"work", exId, start:now}; keepAwake(); save({}); render();
}
// Stop: the set is logged with the weight chosen before Start, then the reps sheet opens while the rest timer runs
function stopSet(askReps){
  const tm=T(); if(tm.phase!=="work") return null; const now=Date.now();
  const s = logSet(tm.exId, Math.round((now-tm.start)/1000), tm.start);
  const x = sessionFor(now); x.end=now; x.u=now; s.sid=x.id;
  if(isCardio(exById(tm.exId))){ s.w=0; s.r=0; S.timer={phase:"idle"}; if(view.name==="ex"){ view={name:"list"}; window.scrollTo(0,0); } save({}); render(); if(MACH[s.ex]) askMach(s.id); else toast(t("cardioDone",{name:exName(exById(s.ex)), t:fmt(s.d)})+" · "+kcalTxt(setKcal(s))); return s; }
  S.timer = {phase:"rest", exId:tm.exId, start:now, setId:s.id, beeped:false}; save({}); render();
  if(askReps!==false) askRepsFor(s.id);
  return s;
}
// fitness class logged by its length, ending now
function logLesson(exId, min){
  const now=Date.now(), st=now-min*60000; closeRest(now, exId);
  const s = logSet(exId, min*60, st); s.w=0; s.r=0;
  const x = sessionFor(now); if(x.start>st) x.start=st; x.end=now; x.u=now; s.sid=x.id;
  view={name:"list"}; window.scrollTo(0,0); save({}); render(); toast(t("cardioDone",{name:exName(exById(exId)), t:fmt(s.d)})+" · "+kcalTxt(kcalOf(MET_CARDIO[exId]||MET_CARDIO_OTHER, s.d)));
}
function quickLog(exId){
  unlockAudio(); const now=Date.now(); closeRest(now, exId);
  const s = logSet(exId, null, now);
  const x = sessionFor(now); x.end=now; x.u=now; s.sid=x.id;
  S.timer = {phase:"rest", exId, start:now, setId:s.id, beeped:false}; keepAwake(); save({}); render();

}
function endRest(){ closeRest(Date.now()); S.timer={phase:"idle"}; save({}); render(); }
// "Finish exercise": the time after the last set is not a rest
function finishExercise(){
  const tm=T(); const exId=tm.exId||view.ex;
  const wasWork = tm.phase==="work";
  const s = wasWork ? stopSet(false) : null;
  S.timer={phase:"idle"}; save({});
  view={name:"list",filter:view.filter||"all"}; window.scrollTo(0,0); render();
  if(s) askRepsFor(s.id, true);
  else toast(t("finished",{name:exName(exById(exId)), n:S.sets.filter(x=>x.ex===exId && dayKey(x.t)===todayKey()).length}));
}
function endGym(){
  const x=openSession(); if(!x) return;
  if(S.timer.phase==="work") stopSet(false);
  S.timer={phase:"idle"}; x.closed=true; x.u=Date.now(); S.currentGym=null; save({}); render();
  toast(t("gymDone",{d:fmtHM(x.end-x.start), n:sessionSets(x).length})+" · "+kcalTxt(sessionKcal(x)));
  endSheet({cal:x, hl:{type:"workout", start:hm(x.start), end:hm(x.end), min:Math.max(1,Math.round((x.end-x.start)/60000)), kcal:Math.round(sessionKcal(x)), weight:S.settings.bw||null}});
}
function logSet(exId, dur, ts){
  const v = vals(exId);
  const s = {id:uid(), ex:exId, w:v.w, r:v.r, t:ts, d:dur, rest:null};
  touchSet(s); S.sets.push(s); return s;

function vals(exId){

// shrink one-line labels (category names) until they fit their box
function fitText(){
  const els=[...document.querySelectorAll(".cat .cn")]; let min=99;
  els.forEach(el=>{
    el.style.fontSize=""; const box=el.closest(".cat"); if(!box) return;
    const pad=parseFloat(getComputedStyle(box).paddingLeft)*2, room=box.clientWidth-pad; let f=parseFloat(getComputedStyle(el).fontSize);

// one handwritten note per step, placed in the emptiest spot near its target, with a looped arrow
function drawNote(el, sel, txt, sub, head, foot){
  const W=innerWidth, H=innerHeight, box=(r,m)=>({l:r.left-m,t:r.top-m,r:r.right+m,b:r.bottom+m});
  const tg=sel&&document.querySelector(sel), rc=tg?box(tg.getBoundingClientRect(),6):null;
  el.innerHTML=`<div class="thead">${head}</div>`+(rc?`<div class="ring" style="left:${rc.l}px;top:${rc.t}px;width:${rc.r-rc.l}px;height:${rc.b-rc.t}px"></div>`:"")
    +`<div class="lbl">${esc(txt)}${sub?`<small>${esc(sub)}</small>`:""}</div><svg></svg><div class="close">${foot}</div>`;
  el.hidden=false;
  const l=el.querySelector(".lbl"), q=l.getBoundingClientRect(), w=q.width, h=q.height;
  if(!rc){ l.style.left=(W-w)/2+"px"; l.style.top=(H-h)/2+"px"; return; }
  const ov=(a,b)=>Math.max(0,Math.min(a.r,b.r)-Math.max(a.l,b.l))*Math.max(0,Math.min(a.b,b.b)-Math.max(a.t,b.t));
  const near=(r,px,py)=>[Math.min(Math.max(px,r.l),r.r), Math.min(Math.max(py,r.t),r.b)];
  const inside=(o,x,y)=>x>o.l&&x<o.r&&y>o.t&&y<o.b;
  const vis=r=>r.width&&r.height&&r.bottom>0&&r.top<H;
  const leaf=[...document.querySelectorAll("#app *, #sheet .sheet *")].filter(e=>(!e.children.length && e.textContent.trim()) || /^(svg|input|select|textarea|img)$/i.test(e.tagName))
    .concat([document.getElementById("tabs")]).map(e=>e.getBoundingClientRect()).filter(vis).map(r=>box(r,4));
  const btns=[...document.querySelectorAll("#app button, #sheet button")].map(e=>e.getBoundingClientRect()).filter(vis).map(r=>box(r,0));
  const fixed=[el.querySelector(".thead"), el.querySelector(".close")].map(e=>box(e.getBoundingClientRect(),6));
  const obs=leaf;
  let best=null;
  for(let y=8; y<=H-8-h; y+=6) for(let x0=8; x0<=W-8-w; x0+=6){
    const b={l:x0,t:y,r:x0+w,b:y+h}; let sc=0;
    for(const o of obs) sc+=ov(b,o);
    for(const o of fixed) sc+=ov(b,o)*60;
    sc+=ov(b,rc)*.15;
    const [ex,ey]=near(rc,x0+w/2,y+h/2), [lx,ly]=near(b,ex,ey), d=Math.hypot(ex-lx,ey-ly);
    sc+= d*4 + (d<28?4000:0);
    for(let s2=1;s2<10;s2++){ const px=lx+(ex-lx)*s2/10, py=ly+(ey-ly)*s2/10; for(const o of leaf) if(inside(o,px,py)){ sc+=250; break; } for(const o of btns) if(!inside(o,ex,ey) && inside(o,px,py)){ sc+=120; break; } }
    if(!best||sc<best.sc) best={sc,x0,y,b};
  }
  l.style.left=best.x0+"px"; l.style.top=best.y+"px";
  const cl=el.querySelector(".close"), cr=box(cl.getBoundingClientRect(),4);
  if(ov(best.b,cr)>0){ const th=el.querySelector(".thead").getBoundingClientRect(); cl.style.bottom="auto"; cl.style.top=(th.bottom+2)+"px"; }
  const [ex,ey]=near(rc,(best.b.l+best.b.r)/2,(best.b.t+best.b.b)/2), [sx0,sy0]=near(best.b,ex,ey);
  const L=Math.hypot(ex-sx0,ey-sy0)||1, ux=(ex-sx0)/L, uy=(ey-sy0)/L, nx=-uy, ny=ux;
  const sx=sx0+ux*6, sy=sy0+uy*6, tx=ex-ux*7, ty=ey-uy*7, D=Math.hypot(tx-sx,ty-sy);
  let d, cx, cy;
  if(D>70){ const px=sx+(tx-sx)*.45, py=sy+(ty-sy)*.45;
    cx=(px+tx)/2+nx*12; cy=(py+ty)/2+ny*12;
    d=`M${sx},${sy} Q${(sx+px)/2+nx*10},${(sy+py)/2+ny*10} ${px},${py} a8,8 0 1 1 ${(ux*.5).toFixed(2)},${(uy*.5).toFixed(2)} Q${cx},${cy} ${tx},${ty}`; }
  else { cx=(sx+tx)/2+nx*14; cy=(sy+ty)/2+ny*14; d=`M${sx},${sy} Q${cx},${cy} ${tx},${ty}`; }
  const a=Math.atan2(ty-cy, tx-cx);
  el.querySelector("svg").innerHTML=`<path d="${d}"/><path d="M${tx-10*Math.cos(a-.55)},${ty-10*Math.sin(a-.55)} L${tx},${ty} L${tx-10*Math.cos(a+.55)},${ty-10*Math.sin(a+.55)}"/>`;
}

function weekGoal(){
  const g=S.settings.goal||3, cnt=new Map();
  for(const s of S.sets){ const w=bucketOf(s.t,"week"); if(!cnt.has(w)) cnt.set(w,new Set()); cnt.get(w).add(dayKey(s.t)); }
  const n=w=>cnt.has(w)?cnt.get(w).size:0, prev=w=>{ const d=new Date(w); d.setDate(d.getDate()-7); return d.getTime(); };
  const cur=bucketOf(Date.now(),"week"); let streak=n(cur)>=g?1:0;
  for(let w=prev(cur); n(w)>=g; w=prev(w)) streak++;
  return {g, n:n(cur), streak};
}

const MAX_ROUNDS = 5;
// old records kept one temperature and time for all rounds
const roundsOf = x=> x.rounds || Array.from({length:x.n||0}, ()=>({temp:x.temp, min:x.min}));
const saunaLine = x=> roundsOf(x).map((r,i)=>`${i+1}) ${r.temp}${isJa()?"℃":"°C"} ${r.min}${isJa()?"分":"min"}`).join(" · ");
// Sauna estimates. Calories: about 1.5 METs while sitting in the heat. Sweat: the weight lost when both weights are entered;
// otherwise roughly 15 g/min for a 70 kg person at 90 °C, scaled by temperature and body weight (a rough guide only).
const MET_SAUNA = 1.5;
const saunaMin = x=> roundsOf(x).reduce((a,r)=>a+(r.min||0),0);
const saunaKcal = x=> kcalOf(MET_SAUNA, saunaMin(x)*60);
// measured only when weight before, weight after and water drunk are all given; sweat = weight lost + water drunk
const sweatMeasured = x=> { if(!x.wb || !x.wa || typeof x.dr!=="number") return null; const g=Math.round((x.wb-x.wa)*1000+x.dr); return g>0? g : null; };
const sweatG = x=> sweatMeasured(x) ?? Math.round(roundsOf(x).reduce((a,r)=>a+15*(r.min||0)*Math.min(1.4,Math.max(.3,((r.temp||90)-40)/50)),0)*bodyKg()/70);
const sweatTxt = x=> sweatMeasured(x)!=null ? t("sweat",{g:sweatG(x).toLocaleString()}) : t("sweatEst",{g:sweatG(x).toLocaleString()});
const saunaSum = x=> sweatTxt(x)+" · "+kcalTxt(saunaKcal(x));

}

function editDay(k){
  let ask=null;
  const draw=()=>{
    const sets=S.sets.filter(s=>dayKey(s.t)===k).sort((a,b)=>a.t-b.t), vis=S.sessions.filter(x=>dayKey(x.start)===k), sau=S.saunas.filter(x=>dayKey(x.t)===k);
    if(!sets.length && !vis.length && !sau.length){ closeSheet(); render(); return; }
    const row=(id,kind,label)=>`<div class="mgr"><span class="nm">${label}</span>${kind==="set"?`<button class="sbtn" data-eset="${id}">${t("fix")}</button>`:""}<button class="sbtn danger" data-ddel="${kind}:${id}">${ask===kind+":"+id?t("reallyDel"):t("del")}</button></div>`;
    sheet.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(dayLabel(k))}"><h3>${dayLabel(k)}</h3><div style="max-height:55vh;overflow:auto">
      ${vis.map(x=>row(x.id,"vis",`${gymName(x)?esc(gymName(x))+" · ":""}${t("stay")} ${clock(x.start)}–${clock(x.end)}`)).join("")}
      ${sau.map(x=>row(x.id,"sau",`${t("sauna")} ${saunaLine(x)}`)).join("")}
      ${sets.map(x=>row(x.id,"set",`${esc(exName(exById(x.ex)))} <span class="sub">${isCardio(exById(x.ex))?fmt(x.d||0):`${x.w?fmtKg(x.w)+"kg × ":""}${x.r}${t("repUnit")}`}</span>`)).join("")}</div>
      <div class="acts"><button class="btn danger" data-ddel="all:${k}">${ask==="all:"+k?t("reallyDel"):t("dayDelAll")}</button><button class="btn" data-act="close">${t("close")}</button></div></div></div>`;
    sheet.querySelectorAll("[data-eset]").forEach(b=>b.onclick=()=>editSet(b.dataset.eset));
    sheet.querySelectorAll("[data-ddel]").forEach(b=>b.onclick=()=>{
      const key=b.dataset.ddel; if(ask!==key){ ask=key; draw(); return; } ask=null;
      const [kind,id]=key.split(":"); const gone=new Set();
      if(kind==="set"||kind==="all") S.sets.filter(x=>kind==="all"?dayKey(x.t)===k:x.id===id).forEach(x=>{ gone.add(x.id); dirtyMonths.add(monthKey(x.t)); if(S.timer.setId===x.id) S.timer={phase:"idle"}; });
      if(kind==="sau"||kind==="all") S.saunas.filter(x=>kind==="all"?dayKey(x.t)===k:x.id===id).forEach(x=>gone.add(x.id));
      if(kind==="vis"||kind==="all") S.sessions.filter(x=>kind==="all"?dayKey(x.start)===k:x.id===id).forEach(x=>gone.add(x.id));
      S.sets=S.sets.filter(x=>!gone.has(x.id)); S.saunas=S.saunas.filter(x=>!gone.has(x.id)); S.sessions=S.sessions.filter(x=>!gone.has(x.id));
      S.deleted.push(...gone); if(S.deleted.length>2000) S.deleted=S.deleted.slice(-2000); metaDirty=true;
      save({}); render(); draw(); toast(t("deleted"));
    });
  };
  draw();
}

    }).join("") || `<div class="card empty">${t("noHist")}</div>`}

// ---------- charts (inline SVG, no libraries) ----------
const hist = {mode:"list", metric:"ex", period:90, ex:null};
const DAY = 86400000;
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function bucketOf(ts, unit){ const d=new Date(startOfDay(ts)); if(unit==="week") d.setDate(d.getDate()-((d.getDay()+6)%7)); else if(unit==="month") d.setDate(1); return d.getTime(); }
function nextBucket(b, unit){ const d=new Date(b); if(unit==="day") d.setDate(d.getDate()+1); else if(unit==="week") d.setDate(d.getDate()+7); else d.setMonth(d.getMonth()+1); return d.getTime(); }
function chartRange(){
  const to=Date.now(); let from;
  if(hist.period) from = startOfDay(to-(hist.period-1)*DAY);
  else { from = to; for(const s of S.sets) if(s.t<from) from=s.t; for(const x of S.sessions) if(x.start<from) from=x.start; for(const x of S.saunas) if(x.t<from) from=x.t; from=startOfDay(from); }
  const span=(to-from)/DAY;
  return {from, to, span, unit: span<=45?"day" : span<=200?"week" : "month"};
}
function bucketLabel(b, unit, long){
  const d=new Date(b);
  if(unit==="month") return isJa()? (long? d.getFullYear()+"年"+(d.getMonth()+1)+"月" : (d.getMonth()+1)+"月") : d.toLocaleDateString("en-US", long?{month:"short",year:"numeric"}:{month:"short"});
  if(long) return unit==="week"? t("weekOf",{d:(d.getMonth()+1)+"/"+d.getDate()}) : dayLabel(dayKey(b));
  return (d.getMonth()+1)+"/"+d.getDate();
}
// sum valFn(item) per bucket, empty buckets included
function perBucket(r, items, tsFn, valFn){
  const bs=[]; for(let b=bucketOf(r.from,r.unit); b<=r.to; b=nextBucket(b,r.unit)) bs.push(b);
  const idx=new Map(bs.map((b,i)=>[b,i])), v=bs.map(()=>0);
  for(const it of items){ const ts=tsFn(it); if(ts<r.from||ts>r.to) continue; const i=idx.get(bucketOf(ts,r.unit)); if(i!=null) v[i]+=valFn(it); }
  return bs.map((b,i)=>({b, v:v[i], label:bucketLabel(b,r.unit), long:bucketLabel(b,r.unit,true)}));
}
function niceStep(span, n){ const raw=span/n; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=raw/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }
function fmtAxis(v){ return v>=10000? Math.round(v/100)/10+"k" : String(Math.round(v*10)/10); }
const CW=340, CH=190, CL=40, CR=8, CT=12, CB=24;
function gridY(lo, hi, st, y){ let g=""; for(let v=lo; v<=hi+st/1000; v+=st) g+=`<line x1="${CL}" x2="${CW-CR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="gl"/><text x="${CL-6}" y="${(y(v)+3.5).toFixed(1)}" class="ya">${fmtAxis(v)}</text>`; return g; }
function barChart(pts, tipFn){
  const iw=CW-CL-CR, ih=CH-CT-CB;
  const mx=Math.max(0,...pts.map(p=>p.v)), st=niceStep(mx||1,4), top=Math.ceil((mx||1)/st)*st;
  const y=v=>CT+ih-(v/top)*ih, n=pts.length, bw=iw/n, every=Math.ceil(n/6);
  let bars="", xl="";
  pts.forEach((p,i)=>{ const x=CL+i*bw;
    bars+=`<g data-tip="${esc(tipFn(p))}"><rect x="${x.toFixed(1)}" y="${CT}" width="${bw.toFixed(1)}" height="${ih}" fill="transparent"/>${p.v>0?`<rect class="col hl" x="${(x+bw*.15).toFixed(1)}" y="${y(p.v).toFixed(1)}" width="${Math.max(1,bw*.7).toFixed(1)}" height="${Math.max(1,ih*p.v/top).toFixed(1)}" rx="${Math.min(3,bw*.2).toFixed(1)}"/>`:""}</g>`;
    if(i%every===0) xl+=`<text x="${(x+bw/2).toFixed(1)}" y="${CH-6}" class="xa">${esc(p.label)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img">${gridY(0,top,st,y)}${bars}${xl}</svg>`;
}
// days: [{ts, a, b, tip}] two series drawn as lines (a = top weight, b = est. 1RM)
function lineChart(r, days){
  const iw=CW-CL-CR, ih=CH-CT-CB;
  const all=days.flatMap(d=>[d.a,d.b]); let mn=Math.min(...all), mx=Math.max(...all);
  const st=niceStep((mx-mn)||mx||1,4); const lo=Math.max(0,Math.floor(mn/st)*st - (mx===mn?st:0)), hi=Math.ceil(mx/st)*st + (mx===mn?st:0);
  const y=v=>CT+ih-((v-lo)/(hi-lo))*ih, x=ts=>CL+((ts-r.from)/Math.max(1,r.to-r.from))*iw;
  const path=k=>days.map((d,i)=>(i?"L":"M")+x(d.ts).toFixed(1)+" "+y(d[k]).toFixed(1)).join("");
  let xl=""; for(let i=0;i<4;i++){ const ts=r.from+(r.to-r.from)*(i+.5)/4; const d=new Date(ts); xl+=`<text x="${x(ts).toFixed(1)}" y="${CH-6}" class="xa">${d.getMonth()+1}/${d.getDate()}</text>`; }
  const dots=days.map(d=>`<g data-tip="${esc(d.tip)}"><circle cx="${x(d.ts).toFixed(1)}" cy="${y(d.a).toFixed(1)}" r="12" fill="transparent"/><circle class="dot hl b" cx="${x(d.ts).toFixed(1)}" cy="${y(d.b).toFixed(1)}" r="3.5"/><circle class="dot hl a" cx="${x(d.ts).toFixed(1)}" cy="${y(d.a).toFixed(1)}" r="3.5"/></g>`).join("");
  return `<svg class="chart" viewBox="0 0 ${CW} ${CH}" role="img">${gridY(lo,hi,st,y)}<path class="ln b" d="${path("b")}"/><path class="ln a" d="${path("a")}"/>${dots}${xl}</svg>`;
}
const e1rm = s=> s.r>1? s.w*(1+s.r/30) : s.w;
function chartHTML(){
  const r=chartRange(); const used=new Set(S.sets.map(s=>s.sid));

  const unitTxt={day:t("perDay"),week:t("perWeek"),month:t("perMonth")}[r.unit];
  const inR=ts=>ts>=r.from&&ts<=r.to;
  let sel="", summary="", chart="", legend="", note="";
  const bars=(pts,fmtV,sumV)=>{ if(!pts.some(p=>p.v>0)) return false; chart=barChart(pts,p=>p.long+"　"+fmtV(p.v)); summary=sumV; note=unitTxt+" · "+t("tapHint"); return true; };
  const m=hist.metric;

    const e=exById(hist.ex); const sets=S.sets.filter(s=>s.ex===hist.ex&&inR(s.t));

    else if(sets.length){
      const byDay={}; for(const s of sets){ const k=startOfDay(s.t); const d=byDay[k]||(byDay[k]={ts:k+DAY/2,a:0,b:0}); d.a=Math.max(d.a,s.w); d.b=Math.max(d.b,e1rm(s)); }
      const days=Object.values(byDay).sort((p,q)=>p.ts-q.ts).map(d=>Object.assign(d,{a:Math.round(d.a*10)/10,b:Math.round(d.b*10)/10,tip:dayLabel(dayKey(d.ts))+"　"+t("maxW")+" "+fmtKg(Math.round(d.a*10)/10)+"kg · "+t("e1rm")+" "+fmtKg(Math.round(d.b*10)/10)+"kg"}));

  } else if(m==="vol"){ const pts=perBucket(r,S.sets.filter(s=>!isCardio(exById(s.ex))),s=>s.t,s=>(s.w||0)*(s.r||0)); bars(pts,v=>Math.round(v).toLocaleString()+"kg",t("sumTotal",{v:Math.round(pts.reduce((a,p)=>a+p.v,0)).toLocaleString()+"kg"})); }
  else if(m==="kcal"){ const pts=perBucket(r,visits,x=>x.start,x=>sessionKcal(x)); const n=visits.filter(x=>inR(x.start)).length, tot=pts.reduce((a,p)=>a+p.v,0);

  else if(m==="stay"){ const pts=perBucket(r,visits,x=>x.start,x=>(x.end-x.start)); const n=visits.filter(x=>inR(x.start)).length, tot=pts.reduce((a,p)=>a+p.v,0);
    pts.forEach(p=>p.v/=60000); bars(pts,v=>fmtHM(v*60000),t("sumTotal",{v:fmtHM(tot)})+" · "+t("sumAvg",{v:fmtHM(tot/Math.max(1,n))})); }
  else if(m==="visits"){ const pts=perBucket(r,visits,x=>x.start,()=>1); const n=pts.reduce((a,p)=>a+p.v,0); bars(pts,v=>t("visitsN",{n:v}),t("sumVisits",{n, w:(n/Math.max(1,(r.to-r.from)/DAY/7)).toFixed(1)})); }
  else if(m==="cardio"){ const pts=perBucket(r,S.sets.filter(s=>isCardio(exById(s.ex))),s=>s.t,s=>(s.d||0)/60); bars(pts,v=>Math.round(v)+t("cMin"),t("sumTotal",{v:Math.round(pts.reduce((a,p)=>a+p.v,0))+t("cMin")})); }
  else if(m==="skcal"){ const pts=perBucket(r,S.saunas,x=>x.t,saunaKcal); const n=S.saunas.filter(x=>inR(x.t)).length, tot=pts.reduce((a,p)=>a+p.v,0);
    if(bars(pts,v=>kcalTxt(v),t("sumTotal",{v:kcalTxt(tot)})+" · "+t("sumAvg",{v:kcalTxt(tot/Math.max(1,n))}))) note=t("bwNote")+"<br>"+note; }

    bars(pts,g,t("sumTotal",{v:g(tot)})+" · "+t("sumAvg",{v:g(tot/Math.max(1,n))})); }
  else if(m==="svisits"){ const pts=perBucket(r,S.saunas,x=>x.t,()=>1); const n=pts.reduce((a,p)=>a+p.v,0); bars(pts,v=>t("visitsN",{n:v}),t("sumVisits",{n, w:(n/Math.max(1,(r.to-r.from)/DAY/7)).toFixed(1)})); }
  else if(m==="parts"){

      summary=t("sumTotal",{v:t("setsN",{n:rows.reduce((a,x)=>a+x[1],0)})}); }
  }
  return `<div class="chips" style="margin-top:12px">${per.map(([d,k])=>`<button class="chip ${hist.period===d?"on":""}" data-period="${d}">${t(k)}</button>`).join("")}</div>
    <div class="chips" style="margin-top:8px">${Object.entries(mets).map(([k,l])=>`<button class="chip ${m===k?"on":""}" data-metric="${k}">${t(l)}</button>`).join("")}</div>
    <div class="card" style="margin-top:12px">${sel}
      ${chart?`<div class="tip" id="tip" data-sum="${esc(summary)}">${esc(summary)}</div>${chart}${legend}<p class="note">${note}</p>`:`<div class="empty">${t("noData")}</div>`}
    </div>`;
}

// ---------- tick ----------
function tick(){
  const tm=T(); const now=Date.now();
  const el = id=>document.getElementById(id);
  if(autoClose(now)){ save({}); if(view.name==="list"||view.name==="history") return render(); }
  const vc=el("visitClock"); const ox=openSession(); if(vc&&ox) vc.textContent = fmtLong(((tm.phase==="idle"?ox.end:now) - ox.start)/1000);
  const vk=el("visitKcal"); if(vk&&ox) vk.textContent = kcalTxt(sessionKcal(ox, tm.phase==="idle"?ox.end:now));
  const onMine = view.name==="ex" && tm.exId===view.ex;
  if(tm.phase==="rest"){
    const sec=(now-tm.start)/1000, target=S.settings.rest;
    if(!tm.beeped && sec>=target){ tm.beeped=true; beep(3); setTimeout(()=>beep(3),1100); document.body.classList.remove("flash"); void document.body.offsetWidth; document.body.classList.add("flash"); setTimeout(()=>document.body.classList.remove("flash"),1300); save({sync:false}); }
    if(sec>15*60){ endRest(); return; }
    const rs=el("sheetRest"); if(rs) rs.textContent=t("restNow",{t:fmt(sec)});
  }
  if(onMine){
    const c=el("clock"); if(c) c.textContent = tm.phase==="idle"?"0:00":fmt((now-tm.start)/1000);
    if(tm.phase==="rest"){
      const sec=(now-tm.start)/1000, target=S.settings.rest, left=target-sec;
      const bar=el("restbar"); if(bar) bar.style.width = Math.min(100,sec/target*100)+"%";
      const info=el("restinfo"); if(info) info.textContent = left>0? t("goalLeft",{t:fmt(target),l:fmt(Math.ceil(left))}) : t("goalOver",{t:fmt(target),l:fmt(-left)});
      const tmEl=el("timer"); if(tmEl) tmEl.classList.toggle("over", left<=0);
    }
  }
  document.body.classList.toggle("ph-work", tm.phase==="work");
  document.body.classList.toggle("ph-rest", tm.phase==="rest");

// Reps entry right after Stop. Closing the sheet keeps the suggested number.
// personal best: heavier than ever, or more reps at the best weight (bodyweight: more reps); needs an earlier day to compare with
function prCheck(s){
  if(!s || !s.r || isCardio(exById(s.ex))) return null;
  const others = S.sets.filter(x=>x.ex===s.ex && x.id!==s.id && x.r>0);
  if(!others.some(x=>dayKey(x.t)!==dayKey(s.t))) return null;
  if(s.w>0){
    const bw=Math.max(0,...others.map(x=>x.w||0));
    if(s.w>bw) return t("prW",{w:fmtKg(s.w)});
    if(s.w===bw && s.r>Math.max(0,...others.filter(x=>x.w===bw).map(x=>x.r))) return t("prWR",{w:fmtKg(s.w), r:s.r});
    return null;
  }
  if(others.some(x=>x.w>0)) return null;
  return s.r>Math.max(0,...others.map(x=>x.r)) ? t("prR",{r:s.r}) : null;
}

// ---------- entry screen ----------
const entry = document.getElementById("entry");
const SLOPE = 0.45; // horizontal run per unit of height for the diagonal
function drawHero(){
  const svg=document.getElementById("hero"), W=svg.clientWidth, H=svg.clientHeight; if(!W||!H||entry.hidden) return;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const bb=document.querySelector(".brandbox"), ctl=document.getElementById(S.settings.nick?"entryMain":"onboard").getBoundingClientRect();
  // the title sits a little below the middle, unless the controls would cover it
  const bh=bb.getBoundingClientRect().height, maxMid=ctl.top-svg.getBoundingClientRect().top-16-bh/2;
  bb.style.top=Math.max(8+bh/2, Math.min(H*.57, maxMid))+"px";
  const set=(id,a)=>{ const el=document.getElementById(id); for(const k in a) el.setAttribute(k,a[k]); };
  const br=document.getElementById("brand"), bmEl=br.querySelector(".bm"), baEl=br.querySelector(".ba"), bsEl=br.querySelector(".bs"), r=svg.getBoundingClientRect();
  let cx=W/2, cy=H/2;
  // centre of the visible glyph: letter-spacing adds blank space after each character
  const glyphX=el=>{ const q=el.getBoundingClientRect(); return (q.left+q.right)/2-(parseFloat(getComputedStyle(el).letterSpacing)||0)/2-r.left; };
  let g, sa; br.style.fontSize="";
  // the title is centred; WORKOUT and SAUNA keep clear of the white "&" by the line's run across the letter height plus a margin,
  // shrinking if it would leave the screen; the line is then drawn through the "&"
  br.style.transform="";
  for(let i=0;i<8;i++){
    const h=bmEl.getBoundingClientRect().height, wa=baEl.getBoundingClientRect().width;
    br.style.gap=Math.max(4, h*.4*SLOPE+10-wa/2)+"px";
    g=bmEl.getBoundingClientRect(); sa=bsEl.getBoundingClientRect();
    if(g.left-r.left>=10 && sa.right-r.left<=W-10) break;
    br.style.fontSize=parseFloat(getComputedStyle(br).fontSize)*.93+"px";
  }
  g=bmEl.getBoundingClientRect(); sa=bsEl.getBoundingClientRect();
  { const a=baEl.getBoundingClientRect(); cx=glyphX(baEl); cy=(a.top+a.bottom)/2-r.top; }
  // slide the tagline so its middle word ("と" / "&") sits on the line
  for(const [lid,mid] of [["ben","enMid"],["bsub","tagMid"]]){
    const bs=document.getElementById(lid), tm=document.getElementById(mid); if(!bs||!tm) continue;
    bs.style.fontSize="";
    // the middle word sits on the line; the row shrinks if that pushes it off the screen
    for(let i=0;i<10;i++){
      bs.style.transform=""; const m=tm.getBoundingClientRect(), my=(m.top+m.bottom)/2-r.top, want=cx+(cy-my)*SLOPE;
      bs.style.transform=`translateX(${want-glyphX(tm)}px)`;
      const q=bs.getBoundingClientRect(); if(q.left-r.left>=10 && q.right-r.left<=W-10) break;
      bs.style.fontSize=parseFloat(getComputedStyle(bs).fontSize)*.92+"px"; } }
  const xt=cx+cy*SLOPE, xb=cx-(H-cy)*SLOPE;
  ["hBg","hGrain"].forEach(id=>set(id,{width:W,height:H}));
  // the purple side is left of the line, the magenta side right of it (overflow is clipped)
  const pt=`0,0 ${xt},0 ${xb},${H} 0,${H}`, pb=`${xt},0 ${xt+3*W},0 ${xb+3*W},${H} ${xb},${H}`;
  set("hTop",{points:pt}); set("cTopP",{points:pt}); set("hBot",{points:pb}); set("cBotP",{points:pb});
  ["hLine","hGlow"].forEach(id=>set(id,{x1:xt,y1:0,x2:xb,y2:H}));
  // the marks fill each side as large background shapes; the dumbbell leans parallel to the line
  const lineX=y=>cx+(cy-y)*SLOPE, place=(id,x,y,sz,rot)=>set(id,{transform:`translate(${x-sz/2},${y-sz/2}) scale(${sz/100})${rot?` rotate(${rot} 50 50)`:""}`});
  const dy=H*.26, dsz=Math.min(H*.42, W*.95); place("iDb", lineX(dy)*.46, dy, dsz, -Math.atan(1/SLOPE)*180/Math.PI);
  const oy=H*.7, osz=Math.min(W*1.0, H*.5); place("iOn", (lineX(oy)+W)/2+W*.04, oy, osz, 0);
}

function showTut(done){

  const slides=[
    ()=>`<div class="mock"><div class="mrow"><span class="chip2">${esc(t("modeGym"))}</span><span class="arr">›</span><span class="chip2">${esc(t("gymCat"))}</span><span class="arr">›</span><span class="chip2">${esc(t("free"))}</span><span class="arr">›</span><span class="chip2">${esc(partName("胸"))}</span></div><div class="mrow"><span class="mb tap" style="flex:0 1 auto;padding:12px 18px">${esc(exName(exById("bench")||{name:"ベンチプレス"}))}</span></div></div>`,
    ()=>`<div class="mock"><div class="mrow"><span class="step">−</span><span class="big">60<small style="font-size:18px"> kg</small></span><span class="step">＋</span></div><span class="mb v tap">${esc(t("start"))}</span></div>`,
    ()=>`<div class="mock" style="border-color:rgba(214,51,108,.5)">${[[1,90,8],[2,92,10],[3,95,12]].map(([n,c,m])=>`<div class="trow"><span>${n}</span><b>${c}℃</b><b>${m}${esc(t("cMin"))}</b></div>`).join("")}</div>`
  ];
  const draw=()=>{ const n=i+2, last=i===slides.length-1;
    el.innerHTML=`<button class="skip" data-t="end">${t("tutSkip")}</button>
      <div class="stage"><h2>${t("tut"+n+"h")}</h2>${slides[i]()}<p class="cap">${t("tut"+n+"c")}</p>${i===0?`<p class="tnote">${t("tutNote")}</p>`:""}</div>
      <div class="dots">${slides.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
      <button class="next" data-t="${last?"end":"next"}">${t(last?"tutGo":"tutNext")}</button>`; };
  const end=()=>{ el.hidden=true; el.innerHTML=""; S.settings.tutDone=true; save({sync:false}); done&&done(); };
  el.onclick=ev=>{ const a=ev.target.closest("[data-t]"); if(!a) return; if(a.dataset.t==="end") end(); else { i++; draw(); } };
  let x0=null; el.ontouchstart=ev=>{ x0=ev.touches[0].clientX; };
  el.ontouchend=ev=>{ if(x0==null) return; const dx=ev.changedTouches[0].clientX-x0; x0=null;
    if(dx<-50&&i<slides.length-1){ i++; draw(); } else if(dx>50&&i>0){ i--; draw(); } };
  el.hidden=false; draw();
}

// ---------- free-text notes ("10/15 エニタイム / ベンチプレス 60kg×10×3 / サウナ 90℃ 8分×3") ----------
function parseNotes(txt){
  const norm = s=> s.normalize("NFKC").toLowerCase().replace(/[\s・\-_]/g,"");
  const names = S.exercises.flatMap(e=>[[norm(e.name),e]].concat(EN_NAME[e.id]?[[norm(EN_NAME[e.id]),e]]:[])).filter(x=>x[0].length>1).sort((a,b)=>b[0].length-a[0].length);
  const gymByName = n=>(S.gyms||[]).find(g=>norm(g.name)===norm(n));
  const out={days:[], sets:[], sessions:[], saunas:[], gyms:[], exercises:[]};
  let day=null, place=null, k=0; const now=new Date();
  const newDay=(d,p)=>{ day={d, place:null, sets:0, saunas:0, ex:new Set()}; out.days.push(day); k=0; if(p) setPlace(p); };
  const setPlace=n=>{ n=n.replace(/^[@＠:：\s]+|[\s。、,]+$/g,"").replace(/^(場所|ジム|place|gym)[:：\s]*/i,"").trim(); if(!n) return;
    let g=gymByName(n)||out.gyms.find(x=>norm(x.name)===norm(n)); if(!g){ g={id:"g"+uid(), name:n, url:"", u:Date.now()}; out.gyms.push(g); } place=g; day.place=g; };
  const at=()=>{ const d=new Date(day.d); d.setHours(12,0,0,0); return d.getTime()+ (k++)*180000; };
  for(let line of String(txt).split(/\r?\n/)){
    line=line.normalize("NFKC").trim(); if(!line) continue;
    const dm=line.match(/^(?:(\d{4})\s*[\/.\-年]\s*)?(\d{1,2})\s*[\/.\-月]\s*(\d{1,2})\s*日?(?:\s*[(（][^)）]*[)）])?\s*(.*)$/);
    if(dm){ let y=dm[1]?+dm[1]:now.getFullYear(); const d=new Date(y,+dm[2]-1,+dm[3]); if(!dm[1] && d>now) d.setFullYear(y-1); newDay(d.getTime()); place=null; if(dm[4]) setPlace(dm[4]); continue; }
    if(!day) newDay(new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime());
    if(/^[@＠]|^(場所|place)[:：]/i.test(line)){ setPlace(line); continue; }
    const n=norm(line);
    if(/サウナ|sauna/.test(n)){
      const temp=+(n.match(/(\d{2,3})(?:℃|度|°c?|c\b)/)||[])[1]||90;
      const mm=n.match(/(\d{1,2})(?:分|min)/); const min=mm?+mm[1]:8;
      const rm=n.match(/(?:分|min)[×x*](\d)/)||n.match(/(\d)(?:回|セット|set|rounds?)/); const rounds=Math.min(MAX_ROUNDS,rm?+rm[1]:1);
      const sp=line.replace(/サウナ|sauna/ig,"").replace(/\d.*$/,"").trim(); if(sp && !place) setPlace(sp);
      out.saunas.push({id:uid(), t:at(), place:day.place&&day.place.id, rounds:Array.from({length:rounds},()=>({temp,min})), wb:null, wa:null, dr:null, u:Date.now()}); day.saunas++; continue; }
    let hit=names.find(([nm])=>n.includes(nm)), e=hit&&hit[1];
    if(!e){ const nm=line.replace(/[\d０-９].*$/,"").replace(/[:：\s]+$/,"").trim(); if(!nm || !/\d/.test(line)) { if(!/\d/.test(line)) setPlace(line); continue; }
      const timed=/(分|min|時間|hour|km)/i.test(line) && !/(kg|キロ|回|rep)/i.test(line);
      e=out.exercises.find(x=>x.name===nm); if(!e){ e={id:"c"+uid(), name:nm, type:timed?"cardio":"free", part:timed?"有酸素":"全身", custom:true, o:1000+S.exercises.length+out.exercises.length, u:Date.now()}; out.exercises.push(e); names.unshift([norm(nm),e]); } }
    const rest=n.replace(norm(exName(e)),"").replace(norm(e.name),"");
    if(isCardio(e)){ const h=+(rest.match(/(\d+(?:\.\d+)?)(?:時間|h)/)||[])[1]||0, m=+(rest.match(/(\d+)(?:分|min)/)||[])[1]||0;
      const d=Math.round((h*60+m)*60)||1800; out.sets.push({id:uid(), ex:e.id, w:0, r:0, t:at(), d, rest:null, u:Date.now()}); day.sets++; day.ex.add(e); continue; }
    // weight×reps×sets, comma-separated groups allowed ("60×10, 65×8")
    for(const g of rest.split(/[,、\/]/)){
      const w=+(g.match(/(\d+(?:\.\d+)?)(?:kg|キロ)/)||[])[1];
      const nums=(g.replace(/(\d+(?:\.\d+)?)(?:kg|キロ)/,"").match(/\d+(?:\.\d+)?/g)||[]).map(Number);
      let ww=w, r, sets=1;
      const rm=g.match(/(\d+)(?:回|reps?)/), sm=g.match(/(\d+)(?:セット|sets?)/);
      if(rm) r=+rm[1]; if(sm) sets=+sm[1];
      const free=nums.filter(x=>!(rm&&x===+rm[1])&&!(sm&&x===+sm[1]));
      if(isNaN(ww)||ww===0){ if(free.length>=2 && !isBw(e)){ ww=free.shift(); } else ww=0; }
      if(r==null) r=free.shift(); if(!sm && free.length) sets=free.shift();
      if(!r) continue; sets=Math.max(1,Math.min(20,Math.round(sets)));
      for(let i=0;i<sets;i++){ out.sets.push({id:uid(), ex:e.id, w:ww||0, r:Math.round(r), t:at(), d:null, rest:null, u:Date.now()}); day.sets++; }
      day.ex.add(e);
    }
  }
  for(const d of out.days){ const ss=out.sets.filter(s=>{ const x=new Date(s.t); return x.toDateString()===new Date(d.d).toDateString(); });
    if(!ss.length) continue; const st=Math.min(...ss.map(s=>s.t)), en=Math.max(...ss.map(s=>s.t+(s.d||0)*1000));
    const x={id:uid(), start:st, end:en, closed:true, cal:null, gym:d.place?d.place.id:null, u:Date.now()}; out.sessions.push(x); ss.forEach(s=>s.sid=x.id); }
  return out;
}
function importNotes(txt){

  if(!days.length){ toast(t("loadFail")); return; }
  const lines=days.map(d=>`${dayLabel(dayKey(d.d))}${d.place?" · "+d.place.name:""}：${[...d.ex].map(e=>exName(e)).join("、")}${d.sets?` ${t("setsN",{n:d.sets})}`:""}${d.saunas?` ${t("sauna")}×${d.saunas}`:""}`);
  sheet.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${esc(t("ntQ"))}">
    <h3>${t("ntQ")}</h3><p class="note" style="white-space:pre-line;color:var(--ink)">${esc(lines.join("\n"))}</p>
    <div class="acts two"><button class="btn" data-act="close">${t("cancel")}</button><button class="btn primary" id="ntok">${t("ntOk")}</button></div></div></div>`;
  sheet.querySelector("#ntok").onclick=()=>{ closeSheet(); S.gyms.push(...p.gyms); S.exercises.push(...p.exercises); S.sets.push(...p.sets); S.sessions.push(...p.sessions); S.saunas.push(...p.saunas);
    p.sets.forEach(s=>dirtyMonths.add(monthKey(s.t))); metaDirty=true; save({}); const el=document.getElementById("imp"); if(el) el.value=""; render(); toast(t("ntDone",{n:p.sets.length+p.saunas.length})); };
}
function loadBackupText(txt){
  if(!/^\s*[{\[]/.test(txt||"")) return importNotes(txt);
  try{ const p=JSON.parse(txt); mergeIn(p); S.sets.forEach(s=>dirtyMonths.add(monthKey(s.t))); metaDirty=true; save({}); render(); toast(t("loaded")); }
  catch(e){ toast(t("loadFail")); }
}
// ---------- merge & cloud sync ----------
const deletedEx = new Set(S.deletedEx||[]);
function mergeIn(p){
  if(!p) return;
  const del = new Set([...(S.deleted||[]), ...(p.deleted||[])]);
  (p.deletedEx||[]).forEach(id=>deletedEx.add(id)); S.deletedEx=[...deletedEx];
  const sets = new Map(S.sets.map(s=>[s.id,s]));
  for(const s of (p.sets||[])){ if(!s||!s.id) continue; const cur=sets.get(s.id); if(!cur || (s.u||0)>(cur.u||0)) sets.set(s.id, Object.assign({},s)); }
  S.sets = [...sets.values()].filter(s=>!del.has(s.id));
  S.deleted = [...del].slice(-2000);
  const exs = new Map(S.exercises.map(e=>[e.id,e]));
  for(const e of (p.exercises||[])){ if(!e||!e.id) continue; const cur=exs.get(e.id); if(!cur || (e.u||0)>(cur.u||0)) exs.set(e.id, Object.assign({},e)); }
  S.exercises = [...exs.values()].filter(e=>!deletedEx.has(e.id));
  const ses = new Map(S.sessions.map(x=>[x.id,x]));
  for(const x of (p.sessions||[])){ if(!x||!x.id) continue; const cur=ses.get(x.id); if(!cur || (x.u||0)>(cur.u||0)) ses.set(x.id, Object.assign({},x)); }
  S.sessions = [...ses.values()].filter(x=>!del.has(x.id));
  const gm = new Map((S.gyms||[]).map(g=>[g.id,g]));
  for(const g of (p.gyms||[])){ if(g&&g.id&&!gm.has(g.id)) gm.set(g.id, Object.assign({},g)); }
  S.gyms=[...gm.values()];
  const sa = new Map((S.saunas||[]).map(x=>[x.id,x]));
  for(const x of (p.saunas||[])){ if(!x||!x.id) continue; const cur=sa.get(x.id); if(!cur || (x.u||0)>(cur.u||0)) sa.set(x.id, Object.assign({},x)); }
  S.saunas=[...sa.values()].filter(x=>!del.has(x.id));
  const mm = new Map((S.menus||[]).map(x=>[x.id,x]));
  for(const x of (p.menus||[])){ if(!x||!x.id) continue; const cur=mm.get(x.id); if(!cur || (x.u||0)>(cur.u||0)) mm.set(x.id, Object.assign({},x)); }
  S.menus=[...mm.values()].filter(x=>!del.has(x.id));
  if(!S.settings.lang && p.lang) S.settings.lang=p.lang;
  if((p.profU||0)>(S.settings.profU||0)){ S.settings.sex=p.sex||null; S.settings.ht=p.ht||null; S.settings.birth=p.birth||null; S.settings.profU=p.profU; }
  if(p.nick && (p.nickU||0)>(S.settings.nickU||0)){ S.settings.nick=p.nick; S.settings.nickU=p.nickU||0; }
  if(p.bw && (p.bwU||0)>(S.settings.bwU||0)){ S.settings.bw=p.bw; S.settings.bwU=p.bwU||0; }
  if(p.last) for(const k in p.last) if(!S.last[k]) S.last[k]=p.last[k];
}

const sync = {on:false, err:false, col:null, timer:null, busy:false};
function scheduleSync(){ if(!sync.on) return; clearTimeout(sync.timer); sync.timer=setTimeout(push, 1500); }
async function push(){
  if(!sync.on) return;
  if(sync.busy){ scheduleSync(); return; }
  sync.busy=true;
  try{
    const months=[...dirtyMonths]; dirtyMonths.clear();
    for(const m of months){ await sync.col.doc("m-"+m).set({sets: S.sets.filter(s=>monthKey(s.t)===m)}); }
    if(metaDirty || months.length){ metaDirty=false;
      await sync.col.doc("meta").set({exercises:S.exercises, sessions:S.sessions, saunas:S.saunas, menus:S.menus||[], gyms:S.gyms, lang:S.settings.lang||null, bw:S.settings.bw||null, bwU:S.settings.bwU||0, nick:S.settings.nick||null, nickU:S.settings.nickU||0, sex:S.settings.sex||null, ht:S.settings.ht||null, birth:S.settings.birth||null, profU:S.settings.profU||0, deleted:S.deleted, deletedEx:S.deletedEx||[], last:S.last, u:Date.now()}); }
    sync.err=false;
  }catch(e){ sync.err=true; metaDirty=true; setTimeout(scheduleSync, 15000); }
  sync.busy=false;
}
(async function initCloud(){
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(user){ try{ const me=await user.me(); viewerName=(me&&me.name)||""; drawEntry(); }catch(e){} }
    if(!db || !user) return;
    const me = await user.id(); if(!me) return;
    sync.col = db.collection("data/users/"+me);
    const snap = await sync.col.get();
    const remote = {sets:[], sessions:[], exercises:[], deleted:[], deletedEx:[], last:null};
    for(const doc of snap.docs){ const d=doc.data()||{};
      if(doc.id==="meta"){ remote.exercises=d.exercises||[]; remote.sessions=d.sessions||[]; remote.gyms=d.gyms||[]; remote.saunas=d.saunas||[]; remote.menus=d.menus||[]; remote.lang=d.lang||null; remote.bw=d.bw||null; remote.bwU=d.bwU||0; remote.nick=d.nick||null; remote.nickU=d.nickU||0; remote.sex=d.sex||null; remote.ht=d.ht||null; remote.birth=d.birth||null; remote.profU=d.profU||0; remote.deleted=d.deleted||[]; remote.deletedEx=d.deletedEx||[]; remote.last=d.last||null; }
      else if(doc.id.startsWith("m-")) remote.sets.push(...(d.sets||[])); }
    const remoteIds = new Set(remote.sets.map(s=>s.id));
    mergeIn(remote);
    sync.on = true; drawEntry();
    for(const s of S.sets) if(!remoteIds.has(s.id)) dirtyMonths.add(monthKey(s.t));
    metaDirty = true;
    save({sync:false}); scheduleSync(); render();
  }catch(e){ sync.on=false; }
})();

// ---------- Google Calendar ----------
const calFail = {};
function isoLocal(ts){ const d=new Date(ts); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00"; }
function utcStamp(ts){ return new Date(ts).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,""); }
function calSum(x){ return x.sr ? t("sauna") : t("calSummary"); }
function calText(x){
  if(x.sr) return saunaLine(x.sr)+" · "+saunaSum(x.sr);
  const lines = groupByEx(sessionSets(x)).map(g=>exName(exById(g.ex))+": " + (isCardio(exById(g.ex))? setsTxt(g.sets) : g.sets.map(s=>fmtKg(s.w)+"kg×"+s.r).join(", ")+" ("+t("setsN",{n:g.sets.length})+")"));
  return t("calStay",{d:fmtHM(x.end-x.start), n:sessionSets(x).length})+" · "+kcalTxt(sessionKcal(x))+"\n"+lines.join("\n");
}
function calEnd(x){ return Math.max(x.end, x.start+5*60000); }
function calLink(x){
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(calSum(x))+"&dates="+utcStamp(x.start)+"/"+utcStamp(calEnd(x))+"&details="+encodeURIComponent(calText(x))+(gymName(x)?"&location="+encodeURIComponent(gymName(x)):"");
}
let mcpP=null;
async function addToCalendar(x){
  if(!window.claude){ window.open(calLink(x), "_blank"); x.cal=true; x.u=Date.now(); save({}); if(view.name==="history") render(); return; }
  const fail = msg=>{ calFail[x.id]=msg; if(view.name==="history") render(); toast(msg+t("calManual")); };
  try{
    if(!window.claude || !window.claude.use) return fail(t("calNoEnv"));
    mcpP = mcpP || window.claude.use("mcp");
    const mcp = await mcpP; if(!mcp) return fail(t("calNoCap"));
    const res = await mcp.callTool("Google Calendar","create_event",Object.assign({summary:calSum(x), startTime:isoLocal(x.start), endTime:isoLocal(calEnd(x)), description:calText(x)}, gymName(x)?{location:gymName(x)}:{}));
    const p = res && res.payload; x.cal = (p && (p.id || (p.event&&p.event.id))) || true; x.u=Date.now(); if(x.sr){ x.sr.cal=x.cal; x.sr.u=x.u; } delete calFail[x.id];
    save({}); render(); toast(t(x.sr?"calOkS":"calOk"));
  }catch(e){
    const code = e && e.code;
    fail(code==="server_not_connected"||code==="server_not_found" ? t("calNotConn")
      : code==="needs_reauth" ? t("calReauth")
      : code==="not_granted"||code==="consent_required" ? t("calDenied") : t("calErr"));
  }
}

drawEntry();
render();
})();
</script>

<script>
(function(){
  const cur = "20261020-0720";
  async function checkUpdate(){
    try{
      if(window.S && S.timer && S.timer.phase==="work") return;
      const r = await fetch(location.pathname+"?u="+Date.now(), {cache:"no-store"}); if(!r.ok) return;
      const m = (await r.text()).match(new RegExp('app-ver" content="([0-9-]+)'));
      if(!m || m[1]<=cur || document.getElementById("updBar")) return;
      // show a bar instead of switching on its own; the user taps to load the new version
      const ja = !(window.S && S.settings && S.settings.lang==="en");
      const bar=document.createElement("div"); bar.id="updBar";
      bar.style.cssText="position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:60;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#1d1726;border:1px solid #8b5cf6;color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.5)";
      bar.innerHTML='<span style="flex:1">'+(ja?"新しいバージョンがあります":"A new version is available")+'</span><button id="updGo" style="background:#8b5cf6;color:#fff;border:0;border-radius:10px;padding:8px 12px;font:700 14px system-ui">'+(ja?"更新する":"Update")+'</button><button id="updX" aria-label="close" style="background:none;border:0;color:#aaa;font-size:20px;padding:0 4px">×</button>';
      document.body.appendChild(bar);
      bar.querySelector("#updGo").onclick=()=>location.replace(location.pathname+"?v="+m[1]);
      bar.querySelector("#updX").onclick=()=>bar.remove();
    }catch(e){}
  }
  checkUpdate();
  document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkUpdate(); });
})();
</script>
